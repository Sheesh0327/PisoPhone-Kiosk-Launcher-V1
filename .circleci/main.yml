# The CI jobs, started by .circleci/config.yml (the setup workflow) with the flags .circleci/what_changed.py worked out
# from the push: each workflow below runs only when its flag is true. See docs/CI.md for the one-time project setup.
#
# Everything that does not need a phone, a box or a router:
#   security        repository security rules, vendored-file record
#   website         the setup page's helpers, the stylesheet, the page in a real browser
#   kotlin          ktlint
#   firmware_tests  clang-format, protocol vectors, generated web assets, firmware host tests
#   firmware_build  the firmware for every board, and the two production (encrypted) builds
#   portal          the router portal (rustfmt, clippy, unit, end-to-end and browser tests), the router setup, the installer,
#                   the computer-side setup, the Telegram monitor, router self-updates, shellcheck
# And what CI builds and commits back to the branch (needs GITHUB_PUSH_TOKEN):
#   apk             unit tests, then the signed APK published to website/update (and the releases repository)
#   router_program  pisoportal for the routers (mipsel_24kc), and the setup file rebuilt around it (beta)
#   firmware_images the coin box images for the web flasher (website/flash, main and beta)
#   test_issues     docs/REAL_WORLD_TESTING.md's issue log synced with GitHub issues
#   firmware_json   website/update/firmware.json after a firmware .bin is published (main)
version: 2.1

parameters:
  security: {type: boolean, default: false}
  kotlin: {type: boolean, default: false}
  firmware_build: {type: boolean, default: false}
  firmware_tests: {type: boolean, default: false}
  portal: {type: boolean, default: false}
  website: {type: boolean, default: false}
  apk: {type: boolean, default: false}
  router_program: {type: boolean, default: false}
  firmware_images: {type: boolean, default: false}
  test_issues: {type: boolean, default: false}
  firmware_json: {type: boolean, default: false}

# Every step runs with bash -e (no pipefail), as on GitHub Actions: lookups like `ls ... | head -1` behave the same.
executors:
  small:
    docker:
      - image: cimg/python:3.12.15
    resource_class: small
    shell: /bin/bash -e
  python:
    docker:
      - image: cimg/python:3.12.15-node
    resource_class: medium
    shell: /bin/bash -e
  java:
    docker:
      - image: cimg/openjdk:17.0.20
    resource_class: small
    shell: /bin/bash -e
  android:
    docker:
      - image: cimg/android:2026.08.1
    resource_class: large
    shell: /bin/bash -e
    environment:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=3
  machine:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    shell: /bin/bash -e

commands:
  bot-git:
    description: Lets the job commit and push to the branch, as CI's own author (what_changed.py skips CI's commits)
    steps:
      - run:
          name: Git identity and push access
          command: |
            if [ -z "$GITHUB_PUSH_TOKEN" ]; then
              echo "ERROR: GITHUB_PUSH_TOKEN is not set in the CircleCI project (docs/CI.md): CI cannot commit its build back."
              exit 1
            fi
            git config --global user.name "pisophone-ci"
            git config --global user.email "ci@pisophone.invalid"
            git remote set-url origin "https://x-access-token:${GITHUB_PUSH_TOKEN}@github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git"
  shellcheck:
    description: One ShellCheck version everywhere
    steps:
      - run:
          name: ShellCheck 0.11.0
          command: |
            curl -fsSLo /tmp/sc.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
            echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/sc.tar.xz" | sha256sum -c -
            tar -xJf /tmp/sc.tar.xz -C /tmp && sudo install -m 755 /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
            shellcheck --version
  pio-key:
    description: One file to key the PlatformIO cache on (the main file and every environment file)
    steps:
      - run: cat esp32_firmware/platformio.ini esp32_firmware/envs/*.ini > /tmp/pio-key

jobs:
  # ---- checks ------------------------------------------------------------------------------------------------------------
  security-rules:
    executor: small
    steps:
      - checkout
      - run: sh scripts/check_security_rules.sh
      - run: python3 scripts/check_vendored.py

  website:
    executor: python
    steps:
      - checkout
      - run:
          name: The setup page's provisioning helpers and the flasher's
          command: |
            node scripts/test_provisioning.js
            node scripts/test_flasher.js
      - run:
          name: The stylesheet matches the page (built from its classes; no third-party script on the page)
          working_directory: tools/site-css
          command: |
            npm ci --no-audit --no-fund
            npm run build
            git diff --exit-code ../../website/css || { echo "ERROR: website/css/app.css is out of date: cd tools/site-css && npm ci && npm run build"; exit 1; }
      - restore_cache:
          keys: [playwright-1.63.0]
      - run:
          name: The page in a browser, with the site's Content-Security-Policy
          command: |
            pip install -q playwright==1.63.0 zxing-cpp==2.3.0 pillow==11.3.0
            playwright install --with-deps chromium
            python3 scripts/tests/test_site_page.py
      - save_cache:
          key: playwright-1.63.0
          paths: [~/.cache/ms-playwright]

  ktlint:
    executor: java
    steps:
      - checkout
      - run:
          name: Check Kotlin style
          command: |
            curl -sSL -o ktlint https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint
            chmod +x ktlint
            ./ktlint --relative "app/src/**/*.kt" "*.kts" "app/*.kts"

  firmware-tests:
    executor: python
    steps:
      - checkout
      - run:
          name: Install tools
          command: |
            sudo apt-get update -q
            sudo apt-get install -y -q libmbedtls-dev
            pip install -q clang-format==23.1.2 cryptography
      - run:
          name: Check C++ formatting
          working_directory: esp32_firmware
          command: |
            FILES=$(ls src/*.cpp include/*.h host_tests/*.cpp | grep -vE "include/(WebDashboard|SuperAdminTemplate|WebAssets)")
            clang-format --dry-run --Werror $FILES
      - run:
          name: Protocol test vectors are reproducible
          command: |
            python3 protocol/gen_vectors.py
            git diff --exit-code protocol
      - run: python3 scripts/embed_web.py --check
      - run: sh esp32_firmware/host_tests/run.sh
      - run: python3 scripts/tests/test_sold_unit_check.py

  firmware-build:
    executor: python
    parameters:
      env: {type: string}
    steps:
      - checkout
      - pio-key
      - restore_cache:
          keys: ['pio-<< parameters.env >>-{{ checksum "/tmp/pio-key" }}']
      - run: pip install -q platformio==6.2.0
      - run:
          name: Compile << parameters.env >>
          working_directory: esp32_firmware
          command: pio run -e << parameters.env >>
      - save_cache:
          key: 'pio-<< parameters.env >>-{{ checksum "/tmp/pio-key" }}'
          paths: [~/.platformio]
      - run:
          name: Owner keys built in (production builds)
          working_directory: esp32_firmware/include
          command: |
            case "<< parameters.env >>" in *production*) ;; *) exit 0 ;; esac
            # Not an error while the owner has not made the keys (docs/KEYS.md), but never silent: until then a box accepts
            # unsigned firmware updates and old shared-secret licenses.
            for f in LicensePubKey.h SuperAdminPubKey.h; do
              if grep -q '_LEN = 0;' "$f"; then echo "WARNING: $f still holds the placeholder: this production build accepts unsigned firmware/credentials (see docs/KEYS.md)"; fi
            done

  portal:
    executor: python
    steps:
      - checkout
      - restore_cache:
          keys: [playwright-1.63.0]
      - restore_cache:
          keys: ['rust-{{ checksum "tools/pisoportal/Cargo.lock" }}', rust-]
      - run:
          name: Rust, Playwright (real-browser test), BusyBox (the router's shell and tools)
          command: |
            [ -x "$HOME/.cargo/bin/rustup" ] || curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> "$BASH_ENV"
            "$HOME/.cargo/bin/rustup" component add rustfmt clippy
            pip install -q playwright==1.63.0 cryptography
            playwright install --with-deps chromium
            sudo apt-get install -y -q busybox-static
      - shellcheck
      - run:
          name: pisoportal style and lints
          working_directory: tools/pisoportal
          command: |
            cargo fmt --check
            cargo clippy --locked --release --all-targets -- -D warnings
      - run:
          name: Build and test pisoportal (host build; the router build is the router-program job)
          working_directory: tools/pisoportal
          command: |
            cargo build --locked --release
            cargo test --locked --release
            python3 tests/test_flow.py
            CHROME=$(ls ~/.cache/ms-playwright/chromium-*/chrome-linux*/chrome | head -1) python3 tests/test_browser.py
      - run:
          name: Shell scripts (shellcheck)
          command: |
            shellcheck -s sh setup/piso-setup.sh.in setup/install.sh router/piso_monitor.sh
            shellcheck -s sh -e SC2034 router/*.init
      - run: python3 router/tests/test_setup.py
      - run: python3 router/tests/test_install.py
      - run: python3 router/tests/test_pisophone_setup.py
      - run: python3 router/tests/test_monitor.py
      - run:
          name: Router updates from the website (signed releases only, staged rollout, undo of a release that does not run)
          command: |
            PISO_TEST_TARGET_DIR=$HOME/test-target python3 router/tests/test_selfupdate.py
            # not an error while the owner has not made the keys (docs/KEYS.md), but never silent
            if [ ! -s tools/pisoportal/owner_key.b64 ]; then echo "WARNING: no owner key built into the router program: routers will install no update from the website (docs/RELEASE.md)"; fi
      - run: python3 tools/build_piso_setup.py --check
      - run: python3 .circleci/test_what_changed.py
      - save_cache:
          key: playwright-1.63.0
          paths: [~/.cache/ms-playwright]
      - save_cache:
          key: 'rust-{{ checksum "tools/pisoportal/Cargo.lock" }}'
          paths: [~/.cargo, ~/.rustup, tools/pisoportal/target, ~/test-target]

  # ---- builds that are committed back -----------------------------------------------------------------------------------
  apk-unit-tests:
    executor: android
    steps:
      - checkout
      - restore_cache:
          keys: ['gradle-{{ checksum "gradle/libs.versions.toml" }}-{{ checksum "app/build.gradle.kts" }}', gradle-]
      - run: bash ./gradlew :app:testDebugUnitTest --no-daemon --no-configuration-cache --stacktrace
      - save_cache:
          key: 'gradle-{{ checksum "gradle/libs.versions.toml" }}-{{ checksum "app/build.gradle.kts" }}'
          paths: [~/.gradle/caches, ~/.gradle/wrapper]
      - store_test_results:
          path: app/build/test-results
      - store_artifacts:
          path: app/build/reports/tests
          destination: unit-test-reports

  apk-publish:
    # Builds, signs and publishes the APK for the branch: main -> https://pisophone.pages.dev/update (stable), any other
    # branch -> https://<branch-alias>.pisophone.pages.dev/update (dev, "-dev" versionName). A dev APK only checks its own
    # branch's folder, so testing a branch never touches production.
    executor: android
    environment:
      # versionCode = APP_VERSION_BASE + the pipeline number: always newer than the last GitHub Actions build (336), and
      # newer with every pipeline (an installed phone refuses an update with a lower versionCode)
      APP_VERSION_BASE: "400"
      PAGES_HOST: pisophone.pages.dev
    steps:
      - checkout
      - restore_cache:
          keys: ['gradle-{{ checksum "gradle/libs.versions.toml" }}-{{ checksum "app/build.gradle.kts" }}', gradle-]
      - run:
          name: Release channel and build number
          command: |
            if [ "$CIRCLE_BRANCH" = main ]; then
              CHANNEL=stable; BASE="https://$PAGES_HOST/update"
            else
              CHANNEL=dev
              # Cloudflare Pages branch alias: lowercase, non-alphanumerics become '-', cut to 28 chars.
              ALIAS=$(printf '%s' "$CIRCLE_BRANCH" | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9]/-/g' | cut -c1-28 | sed 's/^-*//; s/-*$//')
              BASE="https://$ALIAS.${PAGES_HOST}/update"
            fi
            BUILD_NUMBER=$((APP_VERSION_BASE + << pipeline.number >>))
            { echo "export BUILD_CHANNEL=$CHANNEL"; echo "export UPDATE_BASE_URL=$BASE"; echo "export BUILD_NUMBER=$BUILD_NUMBER"; } >> "$BASH_ENV"
            echo "Channel: $CHANNEL, update URL: $BASE, versionCode $BUILD_NUMBER"
      - run:
          name: Signing secrets
          command: |
            missing=""
            for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
              if [ -z "${!name}" ]; then missing="$missing $name"; fi
            done
            if [ -n "$missing" ]; then
              echo "ERROR: missing CircleCI project environment variable(s):$missing (docs/CI.md). A release APK signed with a different key cannot update installed phones, so the build is stopped."
              exit 1
            fi
            echo -n "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d -i > /tmp/release-keystore.jks
      - run:
          name: Build the release APK
          command: KEYSTORE_PATH=/tmp/release-keystore.jks bash ./gradlew :app:assembleRelease --no-daemon --no-configuration-cache --stacktrace
      - run:
          name: Remove the keystore
          when: always
          command: rm -f /tmp/release-keystore.jks
      - bot-git
      - run:
          name: Publish the APK and its version info
          command: |
            VERSION_NAME="1.0.$BUILD_NUMBER"
            if [ "$BUILD_CHANNEL" != stable ]; then VERSION_NAME="$VERSION_NAME-dev"; fi
            APK=app/build/outputs/apk/release/app-release.apk
            [ -f "$APK" ] || { echo "ERROR: no release APK at $APK"; exit 1; }
            # An unsigned or badly signed APK cannot update installed phones; refuse to publish one.
            APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
            SIG_CHECKSUM=""
            if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt
              # QR-code setup: Android only installs an app whose signing certificate has this SHA-256 (URL-safe base64,
              # no padding); the provisioning page puts it in the code
              CERT_SHA=$(sed -n 's/^.*[Ss]igner.* certificate SHA-256 digest: \([0-9a-f]\{64\}\)$/\1/p' /tmp/certs.txt | head -n 1)
              if [ -n "$CERT_SHA" ]; then
                SIG_CHECKSUM=$(python3 -c "import base64,sys; print(base64.urlsafe_b64encode(bytes.fromhex(sys.argv[1])).decode().rstrip('='))" "$CERT_SHA")
                echo "Signing certificate SHA-256: $CERT_SHA (QR checksum $SIG_CHECKSUM)"
              else
                echo "WARNING: no signing certificate SHA-256 in apksigner's output: this build cannot be set up by QR code"
              fi
            else
              echo "WARNING: apksigner not found; skipping signature verification (and no QR setup checksum)."
            fi
            SHA=$(sha256sum "$APK" | awk '{print $1}')
            SIZE=$(stat -c %s "$APK")
            echo "APK SHA-256: $SHA ($SIZE bytes)"

            # The APK also goes to a separate PUBLIC releases repository (phones cannot log in to this private one).
            # Needs RELEASES_TOKEN; see docs/DEPLOY.md.
            RELEASES_REPO="${RELEASES_REPO:-Sheesh0327/PisoPhone-Releases}"
            URL=""
            if [ -n "$RELEASES_TOKEN" ]; then
              if ! command -v gh > /dev/null; then
                curl -fsSL -o /tmp/gh.tgz https://github.com/cli/cli/releases/download/v2.63.2/gh_2.63.2_linux_amd64.tar.gz
                tar -xzf /tmp/gh.tgz -C /tmp && sudo install -m 755 /tmp/gh_2.63.2_linux_amd64/bin/gh /usr/local/bin/gh
              fi
              TAG="app-$BUILD_CHANNEL-$BUILD_NUMBER"
              ASSET="pisophone-$VERSION_NAME.apk"
              cp "$APK" "/tmp/$ASSET"
              PRE=""
              if [ "$BUILD_CHANNEL" != stable ]; then PRE="--prerelease"; fi
              GH_TOKEN="$RELEASES_TOKEN" gh release create "$TAG" "/tmp/$ASSET" --repo "$RELEASES_REPO" \
                --title "PisoPhone $VERSION_NAME" $PRE --notes "Built from $CIRCLE_SHA1 on branch $CIRCLE_BRANCH. SHA-256: $SHA"
              URL="https://github.com/$RELEASES_REPO/releases/download/$TAG/$ASSET"
              echo "Published release asset: $URL"
              # Keep only the 20 newest dev builds.
              GH_TOKEN="$RELEASES_TOKEN" gh release list --repo "$RELEASES_REPO" --limit 200 --json tagName,createdAt \
                -q '[.[] | select(.tagName | startswith("app-dev-"))] | sort_by(.createdAt) | reverse | .[20:] | .[].tagName' \
                | xargs -r -n1 env GH_TOKEN="$RELEASES_TOKEN" gh release delete --repo "$RELEASES_REPO" --cleanup-tag --yes || true
            else
              echo "WARNING: RELEASES_TOKEN is not set: the APK is committed to website/update instead (see docs/DEPLOY.md)."
            fi
            # Phones running a build from before the 'url' field existed still download website/update/app-release.apk,
            # so it stays published until KEEP_PAGES_APK is set to 'false'.
            PUBLISH_APK=0
            if [ -z "$URL" ] || [ "$KEEP_PAGES_APK" != "false" ]; then PUBLISH_APK=1; fi
            # the version info the in-app updater compares against (from the same number baked into the APK)
            URL="$URL" SIG="$SIG_CHECKSUM" SHA="$SHA" SIZE="$SIZE" VERSION_NAME="$VERSION_NAME" python3 -c '
            import json, os, time
            d = {"versionCode": int(os.environ["BUILD_NUMBER"]), "versionName": os.environ["VERSION_NAME"],
                 "channel": os.environ["BUILD_CHANNEL"]}
            if os.environ["URL"]: d["url"] = os.environ["URL"]
            if os.environ["SIG"]: d["signatureChecksum"] = os.environ["SIG"]
            d.update(sha256=os.environ["SHA"], size=int(os.environ["SIZE"]), releaseDate=time.strftime("%Y-%m-%d", time.gmtime()))
            open("/tmp/app.json", "w").write(json.dumps(d, indent=2) + "\n")'
            mkdir -p website/update
            python3 -m json.tool /tmp/app.json > /dev/null
            cp "$APK" /tmp/app-release.apk
            # Only the generated files change, so there is nothing to merge: start from the branch's newest tip each try.
            for attempt in 1 2 3 4 5; do
              git fetch -q origin "$CIRCLE_BRANCH"
              git reset -q --hard "origin/$CIRCLE_BRANCH"
              cp /tmp/app.json website/update/app.json
              git add -f website/update/app.json
              if [ "$PUBLISH_APK" = 1 ]; then
                cp /tmp/app-release.apk website/update/app-release.apk
                git add -f website/update/app-release.apk
              else
                git rm -q -f --ignore-unmatch website/update/app-release.apk
              fi
              if git diff --staged --quiet; then exit 0; fi
              # No [skip ci] marker: Cloudflare Pages honours it and would never deploy this commit.
              git commit -q -m "chore: publish $BUILD_CHANNEL APK build $BUILD_NUMBER"
              if git push -q origin "HEAD:refs/heads/$CIRCLE_BRANCH"; then exit 0; fi
              echo "Push rejected (attempt $attempt); trying again on the newest branch tip."
              sleep $((attempt * 3))
            done
            echo "ERROR: could not publish the APK after 5 attempts."; exit 1
      - save_cache:
          key: 'gradle-{{ checksum "gradle/libs.versions.toml" }}-{{ checksum "app/build.gradle.kts" }}'
          paths: [~/.gradle/caches, ~/.gradle/wrapper]

  router-program:
    # pisoportal for OpenWrt "mipsel_24kc" routers (e.g. MT7621) with OpenWrt's own C toolchain; on beta the binary is
    # committed to tools/pisoportal/bin (with BUILD-INFO) and the setup file rebuilt around it.
    executor: machine
    environment:
      SDK_IMAGE: openwrt/sdk:ramips-mt7621-23.05.5
    steps:
      - checkout
      - run:
          name: Take the C toolchain out of the OpenWrt SDK image
          command: |
            docker pull "$SDK_IMAGE"
            TC=$(docker run --rm "$SDK_IMAGE" sh -c 'ls -d /builder/staging_dir/toolchain-*' | head -1)
            echo "toolchain in the image: $TC"
            id=$(docker create "$SDK_IMAGE")
            docker cp "$id:$TC" "$PWD/toolchain"
            mkdir -p host && docker cp "$id:/builder/staging_dir/host/lib" "$PWD/host/lib"   # the compiler wrapper looks for ../../host/lib
            docker rm "$id" > /dev/null
            echo "export GCC=$(ls "$PWD"/toolchain/bin/*-openwrt-linux-musl-gcc | head -1)" >> "$BASH_ENV"
      - run:
          name: Rust nightly with the standard-library sources (MIPS has no prebuilt standard library)
          command: |
            [ -x "$HOME/.cargo/bin/rustup" ] || curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> "$BASH_ENV"
            "$HOME/.cargo/bin/rustup" toolchain install nightly --profile minimal -c rust-src
      - run:
          name: Build
          working_directory: tools/pisoportal
          command: |
            # panic=abort needs no unwinder; satisfy the "-lunwind" the musl targets ask for with the toolchain's own
            mkdir -p "$PWD/stub"
            echo 'INPUT(-lgcc_eh)' > "$PWD/stub/libunwind.a"
            STAGING_DIR="$(cd ../.. && pwd)/toolchain"; export STAGING_DIR
            export RUSTFLAGS="-C linker=$GCC -C link-arg=-L$PWD/stub -C target-feature=+crt-static -C relocation-model=static -C link-self-contained=no"
            cargo +nightly build --release -Z build-std=std,panic_abort --target mipsel-unknown-linux-musl
            BIN=target/mipsel-unknown-linux-musl/release/pisoportal
            ls -l "$BIN"; file "$BIN"
            mkdir -p ../../dist && cp "$BIN" ../../dist/pisoportal-mipsel
            (cd ../../dist && sha256sum pisoportal-mipsel | tee pisoportal-mipsel.sha256)
            { echo "pisoportal $(grep -m1 '^version' Cargo.toml | cut -d'"' -f2) for mipsel-unknown-linux-musl, from commit $CIRCLE_SHA1"
              rustc +nightly -V; echo "C toolchain: $SDK_IMAGE ($("$GCC" --version | head -n 1))"; } | tee ../../dist/BUILD-INFO
      - store_artifacts:
          path: dist
          destination: pisoportal-mipsel
      - run:
          name: Commit the program and the setup file to the branch (beta)
          command: |
            [ "$CIRCLE_BRANCH" = beta ] || { echo "only beta's build is committed"; circleci-agent step halt; exit 0; }
      - bot-git
      - run:
          name: Commit
          command: |
            cp -r dist /tmp/dist
            for attempt in 1 2 3 4 5; do
              git fetch -q origin "$CIRCLE_BRANCH"
              git reset -q --hard "origin/$CIRCLE_BRANCH"
              mkdir -p tools/pisoportal/bin
              cp /tmp/dist/pisoportal-mipsel /tmp/dist/pisoportal-mipsel.sha256 /tmp/dist/BUILD-INFO tools/pisoportal/bin/
              python3 tools/build_piso_setup.py
              git add tools/pisoportal/bin setup/piso-setup.sh setup/piso-setup.sh.sha256 website/setup website/install.sh website/pisophone_setup.py
              if git diff --cached --quiet; then exit 0; fi
              git commit -q -m "ci: built the router program (mipsel_24kc)"
              if git push -q origin "HEAD:refs/heads/$CIRCLE_BRANCH"; then exit 0; fi
              sleep $((attempt * 3))
            done
            echo "ERROR: could not push the router program"; exit 1

  firmware-images:
    # The coin box firmware (the dev environments: no flash encryption) as ONE merged image per chip, checked and committed
    # with a manifest to website/flash/; flash.html writes it over USB after checking its sha256.
    executor: python
    steps:
      - checkout
      - pio-key
      - restore_cache:
          keys: ['pio-images-{{ checksum "/tmp/pio-key" }}']
      - run: pip install -q platformio==6.2.0 esptool==4.8.1
      - run:
          name: Build and merge (one image per chip)
          working_directory: esp32_firmware
          command: |
            set -eu
            mkdir -p ../website/flash
            VERSION=$(sed -n 's/^#define PISO_FW_VERSION "\(.*\)"/\1/p' include/FirmwareVersion.h)
            [ -n "$VERSION" ] || { echo "ERROR: no PISO_FW_VERSION"; exit 1; }
            builds=""
            # env  esptool chip  chip name as esptool-js reports it  bootloader offset
            for spec in "esp32-c3-dev esp32c3 ESP32-C3 0x0" "esp32dev-dev esp32 ESP32 0x1000"; do
              set -- $spec
              ENV=$1; CHIP=$2; NAME=$3; BOOT=$4
              pio run -e "$ENV"
              B=.pio/build/$ENV
              APP0=$(find ~/.platformio/packages -name boot_app0.bin -path '*partitions*' -print -quit)
              [ -n "$APP0" ] || { echo "ERROR: boot_app0.bin not found"; exit 1; }
              OUT=../website/flash/$ENV.bin
              python -m esptool --chip "$CHIP" merge_bin -o "$OUT" --target-offset "$BOOT" \
                --flash_mode keep --flash_freq keep --flash_size keep \
                "$BOOT" "$B/bootloader.bin" 0x8000 "$B/partitions.bin" 0xe000 "$APP0" 0x10000 "$B/firmware.bin"
              python3 ../.circleci/check_image.py "$OUT" "$BOOT"
              SHA=$(sha256sum "$OUT" | cut -c1-64)
              SIZE=$(stat -c %s "$OUT")
              builds="$builds{\"env\":\"$ENV\",\"chip\":\"$NAME\",\"file\":\"$ENV.bin\",\"offset\":$((BOOT)),\"size\":$SIZE,\"sha256\":\"$SHA\"},"
            done
            printf '{"version":"%s","commit":"%s","builds":[%s]}\n' "$VERSION" "$CIRCLE_SHA1" "${builds%,}" | python3 -m json.tool > ../website/flash/manifest.json
            cat ../website/flash/manifest.json
      - save_cache:
          key: 'pio-images-{{ checksum "/tmp/pio-key" }}'
          paths: [~/.platformio]
      - bot-git
      - run:
          name: Commit the images to the branch
          command: |
            cp -r website/flash /tmp/flash
            for attempt in 1 2 3 4 5; do
              git fetch -q origin "$CIRCLE_BRANCH"
              git reset -q --hard "origin/$CIRCLE_BRANCH"
              rm -rf website/flash && cp -r /tmp/flash website/flash
              git add -A website/flash
              if git diff --staged --quiet; then exit 0; fi
              git commit -q -m "ci: coin box images for the web flasher ($(python3 -c "import json;print(json.load(open('website/flash/manifest.json'))['version'])"))"
              if git push -q origin "HEAD:refs/heads/$CIRCLE_BRANCH"; then exit 0; fi
              sleep $((attempt * 3))
            done
            echo "ERROR: could not push the images"; exit 1

  test-issues:
    # A row added to the Issue log in docs/REAL_WORLD_TESTING.md becomes a GitHub issue and its number is written back;
    # a row set to fixed or wontfix closes it.
    executor: small
    steps:
      - checkout
      - bot-git
      - run:
          name: Create and close issues
          command: |
            GITHUB_TOKEN="$GITHUB_PUSH_TOKEN" GITHUB_REPOSITORY="$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME" \
              GITHUB_REF_NAME="$CIRCLE_BRANCH" python3 .github/scripts/sync_test_issues.py
      - run:
          name: Save the issue numbers into the file
          command: |
            git diff --quiet docs/REAL_WORLD_TESTING.md && exit 0
            git add docs/REAL_WORLD_TESTING.md
            git commit -q -m "chore: link test issues to their GitHub issue numbers"
            git pull -q --rebase --autostash origin "$CIRCLE_BRANCH"
            git push -q origin "HEAD:refs/heads/$CIRCLE_BRANCH"

  firmware-json:
    executor: small
    steps:
      - checkout
      - bot-git
      - run:
          name: Update firmware.json
          command: |
            COMMIT_MSG=$(git log -1 --pretty=%B) python3 scripts/update_firmware_json.py
            git add website/update/firmware.json
            git diff --staged --quiet && exit 0
            git commit -q -m "chore: auto-update firmware.json version tracking"
            git pull -q --rebase --autostash origin "$CIRCLE_BRANCH"
            git push -q origin "HEAD:refs/heads/$CIRCLE_BRANCH"

workflows:
  security:
    when: << pipeline.parameters.security >>
    jobs: [security-rules]
  website:
    when: << pipeline.parameters.website >>
    jobs: [website]
  kotlin:
    when: << pipeline.parameters.kotlin >>
    jobs: [ktlint]
  firmware-tests:
    when: << pipeline.parameters.firmware_tests >>
    jobs: [firmware-tests]
  firmware-build:
    when: << pipeline.parameters.firmware_build >>
    jobs:
      - firmware-build:
          matrix:
            parameters:
              env: [esp32-c3-dev, esp32dev-dev, esp32-c3-production-encrypted, esp32dev-production-encrypted]
  portal:
    when: << pipeline.parameters.portal >>
    jobs: [portal]
  apk:
    when: << pipeline.parameters.apk >>
    jobs:
      - apk-unit-tests
      - apk-publish:
          requires: [apk-unit-tests]
  router-program:
    when: << pipeline.parameters.router_program >>
    jobs: [router-program]
  firmware-images:
    when: << pipeline.parameters.firmware_images >>
    jobs: [firmware-images]
  test-issues:
    when: << pipeline.parameters.test_issues >>
    jobs: [test-issues]
  firmware-json:
    when: << pipeline.parameters.firmware_json >>
    jobs: [firmware-json]
