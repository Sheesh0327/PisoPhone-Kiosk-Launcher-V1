# CircleCI entry point (a setup workflow): one small job reads which files the push changed (.circleci/what_changed.py)
# and continues with .circleci/main.yml, whose workflows run only for the parts that changed. CI's own commits run
# nothing. Needs "Enable dynamic config using setup workflows" in the project's Advanced settings (docs/CI.md).
version: 2.1
setup: true

jobs:
  what-changed:
    docker:
      - image: cimg/python:3.12.15
    resource_class: small
    steps:
      - checkout
      - run:
          name: What changed
          command: python3 .circleci/what_changed.py "<< pipeline.git.base_revision >>"
      - run:
          name: Continue with the jobs that matter
          command: |
            curl -fsS -X POST https://circleci.com/api/v2/pipeline/continue \
              -H "Content-Type: application/json" --data @/tmp/continue.json

workflows:
  setup:
    jobs:
      - what-changed
