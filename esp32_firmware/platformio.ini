; PlatformIO Project Configuration File for ESP32-C3 / ESP32 Master Kiosk Firmware
; Framework: Arduino

[platformio]
src_dir = .
default_envs = esp32-c3-dev

; ====================================================================
; 1. DEVELOPMENT ENVIRONMENT (DEFAULT - NO FLASH ENCRYPTION)
; Use this environment for initial testing, debugging, and iteration.
; ====================================================================
[env:esp32-c3-dev]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv
build_flags = 
    -D BUILD_ENV_DEV=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Standard ESP32 DevKit V1 Development Environment
[env:esp32dev-dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv
build_flags = 
    -D BUILD_ENV_DEV=1


; ====================================================================
; 2. PRODUCTION ENVIRONMENT (HARDWARE FLASH ENCRYPTION ENABLED)
; ONLY use this environment when you are 100% ready for final deployment.
; Once flashed on a unit with eFuse burned, flash contents cannot be read.
; ====================================================================
[env:esp32-c3-production-encrypted]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions_encrypted.csv
board_build.flash_mode = dio
extra_scripts = post:enable_security_hooks.py
build_flags = 
    -D BUILD_ENV_PRODUCTION=1
    -D CONFIG_SECURE_FLASH_ENC_ENABLED=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Standard ESP32 DevKit V1 Production Encrypted Environment
[env:esp32dev-production-encrypted]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions_encrypted.csv
board_build.flash_mode = dio
extra_scripts = post:enable_security_hooks.py
build_flags = 
    -D BUILD_ENV_PRODUCTION=1
    -D CONFIG_SECURE_FLASH_ENC_ENABLED=1

