; One image per product (include/Product.h). The files of the other product are left out of the build, so nothing of it is in the
; binary. The full TechNet PisoHub images are the four environments in the other files here.

; PisoPhone only: no router gateway code.
[phone_only]
build_flags = -D PISO_PRODUCT_PHONE=1
build_src_filter = +<*> -<GatewayCoinslot.cpp> -<WebServerGateway.cpp>

; PisoWiFi only: no phones (pairing, slots, licenses, profiles, accounts, the phone link and discovery).
[wifi_only]
build_flags = -D PISO_PRODUCT_WIFI=1
build_src_filter = +<*> -<AccountStorage.cpp> -<WebServerAccounts.cpp> -<DeviceManager.cpp> -<WebSocketsUdp.cpp> -<ControllerWebSocket.cpp> -<Discovery.cpp> -<WebServerProfiles.cpp> -<PhoneProfileStore.cpp> -<WebServerTelemetry.cpp> -<WebServerCoinslot.cpp>

[env:esp32-c3-dev-phone]
extends = env:esp32-c3-dev
build_flags = ${env:esp32-c3-dev.build_flags} ${phone_only.build_flags}
build_src_filter = ${phone_only.build_src_filter}

[env:esp32dev-dev-phone]
extends = env:esp32dev-dev
build_flags = ${env:esp32dev-dev.build_flags} ${phone_only.build_flags}
build_src_filter = ${phone_only.build_src_filter}

[env:esp32-c3-production-encrypted-phone]
extends = env:esp32-c3-production-encrypted
build_flags = ${env:esp32-c3-production-encrypted.build_flags} ${phone_only.build_flags}
build_src_filter = ${phone_only.build_src_filter}

[env:esp32dev-production-encrypted-phone]
extends = env:esp32dev-production-encrypted
build_flags = ${env:esp32dev-production-encrypted.build_flags} ${phone_only.build_flags}
build_src_filter = ${phone_only.build_src_filter}

[env:esp32-c3-dev-wifi]
extends = env:esp32-c3-dev
build_flags = ${env:esp32-c3-dev.build_flags} ${wifi_only.build_flags}
build_src_filter = ${wifi_only.build_src_filter}

[env:esp32dev-dev-wifi]
extends = env:esp32dev-dev
build_flags = ${env:esp32dev-dev.build_flags} ${wifi_only.build_flags}
build_src_filter = ${wifi_only.build_src_filter}

[env:esp32-c3-production-encrypted-wifi]
extends = env:esp32-c3-production-encrypted
build_flags = ${env:esp32-c3-production-encrypted.build_flags} ${wifi_only.build_flags}
build_src_filter = ${wifi_only.build_src_filter}

[env:esp32dev-production-encrypted-wifi]
extends = env:esp32dev-production-encrypted
build_flags = ${env:esp32dev-production-encrypted.build_flags} ${wifi_only.build_flags}
build_src_filter = ${wifi_only.build_src_filter}
