; One image per product (include/Product.h). The files of the other product are left out of the build, so nothing of it is in the
; binary. The full TechNet PisoHub images are the four environments in the other files here.

; PisoPhone only: phone features + router gateway coordination.
[phone_only]
build_flags = -D PISO_PRODUCT_PHONE=1
build_src_filter = +<*> -<WebServerChores.cpp> -<WifiFasServer.cpp> -<WifiConsoleServer.cpp> -<MultiBoxCoordinator.cpp>

; PisoWiFi only: no phones (pairing, slots, licenses, profiles, accounts, the phone link and discovery).
[wifi_only]
build_flags = -D PISO_PRODUCT_WIFI=1
build_src_filter = +<*> -<AccountStorage.cpp> -<WebServerAccounts.cpp> -<DeviceManager.cpp> -<WebSocketsUdp.cpp> -<ControllerWebSocket.cpp> -<Discovery.cpp> -<WebServerProfiles.cpp> -<PhoneProfileStore.cpp> -<ShopBrandingStore.cpp> -<WebServerBranding.cpp> -<WebServerTelemetry.cpp> -<WebServerCoinslot.cpp> -<WebServerVoice.cpp> -<WebServerChores.cpp> -<WebDashboardComponents.cpp> -<WebDashboardHtml.cpp>

; PisoHome only: family screen-time & chores, no router gateway, no accounts/cards, no shop branding, no commercial revenue vault / super-admin.
[home_only]
build_flags = -D PISO_PRODUCT_HOME=1
build_src_filter = +<*> -<GatewayCoinslot.cpp> -<WebServerGateway.cpp> -<AccountStorage.cpp> -<WebServerAccounts.cpp> -<ShopBrandingStore.cpp> -<WebServerBranding.cpp> -<SuperAdminManager.cpp> -<SuperAdminSession.cpp> -<RevenueVault.cpp> -<WifiFasServer.cpp> -<WifiConsoleServer.cpp> -<MultiBoxCoordinator.cpp>

[env:esp32-c3-dev-phone]
extends = env:esp32-c3-dev
build_flags = ${env:esp32-c3-dev.build_flags} ${phone_only.build_flags}
build_src_filter = ${phone_only.build_src_filter}

[env:esp32dev-dev-phone]
extends = env:esp32dev-dev
build_flags = ${env:esp32dev-dev.build_flags} ${phone_only.build_flags}
