# Coin-slot settings for the OpenNDS integration. Installed to /etc/coinslot.conf (chmod 600: it holds the key).

# The ESP32 box: IP or hostname reachable from the router, and the gateway key you set on the box
# (curl -u admin:<pw> "http://<box>/api/gateway/config" --data-urlencode "key=<key>").
GW_BOX=192.168.1.10
GW_KEY=change-me-to-the-key-set-on-the-box

# How much Wi-Fi time one coin (1 pulse) buys, in minutes.
WIFI_MINUTES_PER_COIN=10

# How long the customer has to insert coins after tapping "Insert coin", in seconds (5-120).
COIN_WINDOW_SECONDS=60

# The listener only ever listens on 127.0.0.1 (the theme talks to it from the router itself).
LISTEN_PORT=8099

# Scratch space for per-customer payment state (RAM disk, cleared on reboot).
STATE_DIR=/tmp/coinslot
