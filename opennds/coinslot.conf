# Reference copy of /etc/coinslot.conf (INSTRUCTIONS.md writes the real one). Only GW_BOX and GW_KEY are required;
# every other line shows the default and can be left out.

# The ESP32 box: IP or hostname reachable from the router, and the gateway key set on the box.
GW_BOX=192.168.1.10
GW_KEY=change-me-to-the-key-set-on-the-box

# Plans: "pesos:minutes" tiers. Any amount buys the best combination, e.g. Endurance 17 pesos = 10+5+1+1 = 11 hrs 30 min.
HYPER_TIERS="5:30 10:60 20:120"
HYPER_PRORATA_MIN=6                 # HyperSpeed pesos that fit no tier (1-4) buy this many minutes each
ENDURANCE_TIERS="1:15 5:180 10:480 20:1440"
ENDURANCE_DOWN_KBPS=5000            # Endurance speed caps (kilobits/s): 5 Mbit/s down, 2 Mbit/s up
ENDURANCE_UP_KBPS=2000

# Pause: an Endurance session that paid at least PAUSE_MIN_PESOS can be paused once; the paused time is kept for
# PAUSE_MAX_HOURS. (Bursting is openNDS' own feature, set with uci: see INSTRUCTIONS.md.)
PAUSE_MIN_PESOS=10
PAUSE_MAX_HOURS=72

# Coin window: first wait, wait after every coin, hard cap (seconds; the box itself caps a session at 120 s).
COIN_FIRST_WAIT_SECONDS=30
COIN_IDLE_WAIT_SECONDS=15
COIN_MAX_SECONDS=115

# Fair use (HyperSpeed only): after FAIR_USE_GB the speed is cut for FAIR_THROTTLE_MINUTES, then restored for
# FAIR_FULL_MINUTES, and so on until the session ends.
FAIR_USE_GB=5
FAIR_THROTTLE_DOWN_KBPS=2000
FAIR_THROTTLE_UP_KBPS=1000
FAIR_THROTTLE_MINUTES=5
FAIR_FULL_MINUTES=2

LISTEN_PORT=8099                    # listener, 127.0.0.1 only
STATE_DIR=/tmp/coinslot             # per-customer scratch state (RAM, cleared on reboot)
DATA_DIR=/etc/coinslot.d            # vouchers and revenue.csv (flash: survives a reboot)
