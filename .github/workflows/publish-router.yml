name: Publish the router update

# When the router setup file on main changes (the router-program workflow builds it on beta and it reaches main by merge),
# signs it with the owner key and publishes website/update/router.json + router-setup.sh. Routers then take it with
# `piso-setup update` (or by themselves overnight; docs/RELEASE.md section 3a). A router installs only a release that is
#   - signed by the owner key built into its program (tools/pisoportal/owner_key.b64),
#   - newer than the one it runs (raise setup/RELEASE for every update), and
#   - within its turn of the staged rollout.
#
# The signing key is OWNER_SIGNING_KEY_B64, made once on the owner's own computer with
# `python3 scripts/make_owner_keys.py --github-secret` (docs/KEYS.md). It lives only in the protected GitHub Environment
# "production-signing" (a required reviewer, main only: docs/RELEASE.md, "Protect the signing keys"), so this job waits for the
# owner's approval before it can read the key. This workflow only ever runs on pushes to main.
on:
  push:
    branches:
      - main
    paths:
      - 'setup/piso-setup.sh'
      - 'setup/piso-setup-*.sh'
      - 'tools/pisoportal/src/console-ui.js'
      - 'setup/RELEASE'
      - '.github/workflows/publish-router.yml'
  workflow_dispatch:
    inputs:
      rollout:
        description: 'Percent of routers that take it now (100 = everyone; run again with a higher number to widen). Leave empty to keep what is published.'
        default: ''
      changelog:
        description: 'One line for the routers'' Telegram message'
        default: ''

permissions:
  contents: write

concurrency:
  group: publish-router
  cancel-in-progress: false

jobs:
  publish:
    name: Sign and publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production-signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the signing library
        run: pip install cryptography==44.0.0
      - name: Check the keys
        env:
          OWNER_SIGNING_KEY_B64: ${{ secrets.OWNER_SIGNING_KEY_B64 }}
        run: |
          if [ -z "$OWNER_SIGNING_KEY_B64" ]; then
            echo "::error::The repository secret OWNER_SIGNING_KEY_B64 is not set, so no router update can be signed. Run python3 scripts/make_owner_keys.py --github-secret on your own computer (docs/KEYS.md)."
            exit 1
          fi
          if [ ! -s tools/pisoportal/owner_key.b64 ]; then
            echo "::error::tools/pisoportal/owner_key.b64 is empty: routers have no owner key built in and would refuse every update. Commit the public key make_owner_keys.py wrote, let CI rebuild the router program, and install that setup file on each router by hand once (docs/RELEASE.md)."
            exit 1
          fi
      - name: Sign and commit
        env:
          OWNER_SIGNING_KEY_B64: ${{ secrets.OWNER_SIGNING_KEY_B64 }}
          # a push to main publishes a NEW release to 0% of the routers (the new setup file is what the installer gives a new router; no
          # installed router takes it yet). Widen it by hand: Run workflow with a percentage (10, then 100). A file that is already published
          # is never re-signed by a push, so a widened rollout stays.
          ROLLOUT: ${{ github.event.inputs.rollout || '0' }}
          ROLLOUT_SET: ${{ github.event.inputs.rollout }}
          CHANGELOG: ${{ github.event.inputs.changelog }}
        run: |
          set -eu
          RELEASE=$(tr -d '[:space:]' < setup/RELEASE)
          [ -n "$CHANGELOG" ] || CHANGELOG="Router software release $RELEASE"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          KEY="$RUNNER_TEMP/owner.pem"
          trap 'rm -f "$KEY"' EXIT
          (umask 077; printf '%s' "$OWNER_SIGNING_KEY_B64" | tr -d '\r\n ' | base64 -d > "$KEY")
          # What was approved is this run's commit: the router files and the signing script are fingerprinted now, and the loop below
          # (which rebases onto the newest main to push) signs only when they are still exactly these. Anything pushed to main after
          # the approval is never signed by this run.
          # The fingerprint also covers the console script, its signing script and this workflow file. And every signing script runs
          # from $TRUSTED, a copy of $GITHUB_SHA, never from the tree the loop has moved to the newest main.
          FILES="setup/piso-setup*.sh scripts/sign_router.py scripts/sign_console_ui.py scripts/owner_key.py tools/pisoportal/src/console-ui.js .github/workflows/publish-router.yml"
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] || { echo "::error::the checkout is not $GITHUB_SHA"; exit 1; }
          APPROVED=$(sha256sum $FILES)
          TRUSTED="$RUNNER_TEMP/trusted"
          git worktree add -q --detach "$TRUSTED" "$GITHUB_SHA"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            if [ "$(sha256sum $FILES)" != "$APPROVED" ]; then
              if [ "$GITHUB_EVENT_NAME" = push ]; then
                # (the push that changed them started its own run, which asks for its own approval)
                echo "::notice::main has newer router files than this run's commit ($GITHUB_SHA): nothing signed here, the run of the newer push signs them."
                exit 0
              fi
              echo "::error::main has new router files since this run was approved ($GITHUB_SHA): nothing was signed. Run the workflow again for the newest main."
              exit 1
            fi
            # the router file: nothing to sign when exactly this file is already published at this rollout
            if [ -f website/update/router-setup.sh ] && cmp -s setup/piso-setup.sh website/update/router-setup.sh \
               && { [ -z "$ROLLOUT_SET" ] || python3 -c "import json,sys; sys.exit(0 if str(json.load(open('website/update/router.json')).get('rollout')) == sys.argv[1] else 1)" "$ROLLOUT" 2> /dev/null; }; then
              echo "Router release $RELEASE is already published."
            else
              python3 "$TRUSTED/scripts/sign_router.py" --private "$KEY" --setup setup/piso-setup.sh --out-dir website/update --rollout "$ROLLOUT" --changelog "$CHANGELOG"
            fi
            # the other CPU families: setup/piso-setup-<family>.sh is signed into website/update/<family>/
            for F in setup/piso-setup-*.sh; do
              [ -f "$F" ] || continue
              FAM=$(basename "$F" .sh); FAM=${FAM#piso-setup-}
              if [ -f "website/update/$FAM/router-setup.sh" ] && cmp -s "$F" "website/update/$FAM/router-setup.sh" \
                 && { [ -z "$ROLLOUT_SET" ] || python3 -c "import json,sys; sys.exit(0 if str(json.load(open('website/update/$FAM/router.json')).get('rollout')) == sys.argv[1] else 1)" "$ROLLOUT" 2> /dev/null; }; then
                echo "$FAM release $RELEASE is already published."
              else
                python3 "$TRUSTED/scripts/sign_router.py" --private "$KEY" --setup "$F" --out-dir "website/update/$FAM" --rollout "$ROLLOUT" --changelog "$CHANGELOG"
              fi
              git add -f "website/update/$FAM/router.json" "website/update/$FAM/router-setup.sh"
            done
            # the console page's script (routers use a newer signed one from the website): sign it when it changed
            if ! cmp -s tools/pisoportal/src/console-ui.js website/console/ui.js 2> /dev/null; then
              python3 "$TRUSTED/scripts/sign_console_ui.py" --private "$KEY" --src tools/pisoportal/src/console-ui.js --out-dir website/console
            fi
            git add -f website/update/router.json website/update/router-setup.sh
            [ ! -f website/console/ui.json ] || git add -f website/console/ui.js website/console/ui.json
            if git diff --staged --quiet; then exit 0; fi
            git commit -q -m "ci: router release $RELEASE signed and published ($ROLLOUT%)"
            if git push origin HEAD:refs/heads/main; then exit 0; fi
            sleep $((attempt * 3))
          done
          echo "::error::could not push the router release"; exit 1
