name: Verify Production Candidate

on:
  push:
    branches:
      - codex/app-production-hardening
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

  esp32:
    name: ESP32-C3 firmware build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio
      - name: Build development firmware
        run: pio run --project-dir esp32_firmware --environment esp32-c3-dev
