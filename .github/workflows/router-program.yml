name: Router program (all CPU families)

# Builds pisoportal for the OpenWrt CPU families routers use, with OpenWrt's own C toolchain for each (the SDK images), commits the
# binaries to tools/pisoportal/bin (BUILD-INFO says what each was built with) and regenerates the setup files that embed them:
#   mipsel   (MT7621, MT7620, MT7628: e.g. the 360T6M)       setup/piso-setup.sh   (as it always was)
#   mips     (ath79: many TP-Link routers)                    setup/piso-setup-mips.sh
#   aarch64  (MediaTek Filogic/MT7622, IPQ60xx: newer routers) setup/piso-setup-aarch64.sh
#   armv7    (Qualcomm IPQ40xx and similar)                    setup/piso-setup-armv7.sh
#   x86_64   (mini PCs, VMs)                                   setup/piso-setup-x86_64.sh
# so the setup files on the branch always carry the programs built from the branch's source. A family that fails to build does not stop
# the others (its program and setup file are simply not updated).
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/pisoportal/src/**'
      - 'tools/pisoportal/Cargo.*'
      - 'tools/pisoportal/owner_key.b64'
      - 'setup/RELEASE'
      - 'router/*.init'
      - 'router/piso_monitor.sh'
      - 'router/pisoportal_status.sh'
      - 'setup/piso-setup.sh.in'
      - 'setup/src/**'
      - 'tools/build_piso_setup.py'
      - '.github/workflows/router-program.yml'

permissions:
  contents: write

# A newer push supersedes an unfinished build of the same branch (both would commit the binaries).
concurrency:
  group: router-program-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build pisoportal (${{ matrix.family }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { family: mipsel,  image: 'openwrt/sdk:ramips-mt7621-23.05.5',      target: mipsel-unknown-linux-musl,       buildstd: true }
          - { family: mips,    image: 'openwrt/sdk:ath79-generic-23.05.5',      target: mips-unknown-linux-musl,         buildstd: true }
          - { family: aarch64, image: 'openwrt/sdk:mediatek-filogic-23.05.5',    target: aarch64-unknown-linux-musl,      buildstd: false }
          - { family: armv7,   image: 'openwrt/sdk:ipq40xx-generic-23.05.5',     target: armv7-unknown-linux-musleabihf,  buildstd: false }
          - { family: x86_64,  image: 'openwrt/sdk:x86-64-23.05.5',              target: x86_64-unknown-linux-musl,       buildstd: false }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Take the C toolchain out of the OpenWrt SDK image
        run: |
          docker pull "${{ matrix.image }}"
          TC=$(docker run --rm "${{ matrix.image }}" sh -c 'ls -d /builder/staging_dir/toolchain-*' | head -1)
          echo "toolchain in the image: $TC"
          id=$(docker create "${{ matrix.image }}")
          docker cp "$id:$TC" "$PWD/toolchain"
          mkdir -p host && docker cp "$id:/builder/staging_dir/host/lib" "$PWD/host/lib"   # the compiler wrapper looks for ../../host/lib
          docker rm "$id" > /dev/null
          echo "GCC=$(ls "$PWD"/toolchain/bin/*-openwrt-linux-musl*-gcc | head -1)" >> "$GITHUB_ENV"

      - name: Rust toolchain (MIPS has no prebuilt standard library, so it uses nightly with the sources)
        run: |
          if [ "${{ matrix.buildstd }}" = true ]; then
            rustup toolchain install nightly --profile minimal -c rust-src
          else
            rustup target add "${{ matrix.target }}"
          fi

      - name: Build
        working-directory: tools/pisoportal
        run: |
          export STAGING_DIR="$GITHUB_WORKSPACE/toolchain"
          if [ "${{ matrix.buildstd }}" = true ]; then
            # panic=abort needs no unwinder; satisfy the "-lunwind" the musl targets ask for with the toolchain's own
            mkdir -p "$PWD/stub"
            echo 'INPUT(-lgcc_eh)' > "$PWD/stub/libunwind.a"
            export RUSTFLAGS="-C linker=$GCC -C link-arg=-L$PWD/stub -C target-feature=+crt-static -C relocation-model=static -C link-self-contained=no"
            cargo +nightly build --release -Z build-std=std,panic_abort --target "${{ matrix.target }}"
          else
            export RUSTFLAGS="-C linker=$GCC -C target-feature=+crt-static"
            cargo build --release --locked --target "${{ matrix.target }}"
          fi
          BIN="target/${{ matrix.target }}/release/pisoportal"
          ls -l "$BIN"
          file "$BIN"
          OUT="../../dist"; mkdir -p "$OUT" && cp "$BIN" "$OUT/pisoportal-${{ matrix.family }}"
          (cd "$OUT" && sha256sum "pisoportal-${{ matrix.family }}" | tee "pisoportal-${{ matrix.family }}.sha256")
          { echo "pisoportal $(grep -m1 '^version' Cargo.toml | cut -d'"' -f2) for ${{ matrix.target }} (${{ matrix.family }}), from commit $GITHUB_SHA"
            rustc -V; echo "C toolchain: ${{ matrix.image }} ($("$GCC" --version | head -n 1))"; } | tee "$OUT/BUILD-INFO-${{ matrix.family }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pisoportal-${{ matrix.family }}
          path: dist/

      # Each family commits only its own two files, so the jobs never touch the same file; the last job rebuilds the setup files.
      - name: Commit this family's program to the branch
        if: github.ref_name == 'beta'
        run: |
          set -eu
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p tools/pisoportal/bin
          cp "dist/pisoportal-${{ matrix.family }}" "dist/pisoportal-${{ matrix.family }}.sha256" "dist/BUILD-INFO-${{ matrix.family }}" tools/pisoportal/bin/
          [ "${{ matrix.family }}" != mipsel ] || cp dist/BUILD-INFO-mipsel tools/pisoportal/bin/BUILD-INFO
          git add tools/pisoportal/bin
          git diff --cached --quiet && exit 0
          git commit -m "ci: built the router program (${{ matrix.family }})"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin "$GITHUB_REF_NAME" && git push && exit 0
            sleep $((i * 4))
          done
          echo "::error::could not push the ${{ matrix.family }} program"; exit 1

  commit:
    name: Regenerate the setup files
    needs: build
    if: always() && github.ref_name == 'beta'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: beta   # (the programs were pushed to the branch by the jobs above)
      - name: Rebuild the setup files around the programs on the branch
        run: |
          set -eu
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          ls -l tools/pisoportal/bin
          python3 tools/build_piso_setup.py
          git add setup/piso-setup*.sh setup/piso-setup*.sha256 website/setup website/install.sh website/pisophone_setup.py
          git diff --cached --quiet || { git commit -m "ci: rebuilt the setup files around the router programs"; git pull --rebase -q origin beta && git push; }
