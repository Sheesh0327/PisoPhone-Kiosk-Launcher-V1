name: Router program (mipsel_24kc)

# Builds pisoportal for OpenWrt "mipsel_24kc" routers (e.g. MT7621) with OpenWrt's own C toolchain, commits the binary
# to tools/pisoportal/bin (with BUILD-INFO: the exact toolchain) and regenerates setup/piso-setup.sh, which embeds it, so
# the setup file on the branch always carries the program built from the branch's source.
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/pisoportal/src/**'
      - 'tools/pisoportal/Cargo.*'
      - 'tools/pisoportal/owner_key.b64'
      - 'setup/RELEASE'
      - 'router/*.init'
      - 'router/piso_monitor.sh'
      - 'setup/piso-setup.sh.in'
      - 'tools/build_piso_setup.py'
      - '.github/workflows/router-program.yml'

permissions:
  contents: write

# A newer push supersedes an unfinished build of the same branch (both would commit the binary).
concurrency:
  group: router-program-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_IMAGE: openwrt/sdk:ramips-mt7621-23.05.5

jobs:
  mipsel:
    name: Build pisoportal for mipsel_24kc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Take the C toolchain out of the OpenWrt SDK image
        run: |
          docker pull "$SDK_IMAGE"
          TC=$(docker run --rm "$SDK_IMAGE" sh -c 'ls -d /builder/staging_dir/toolchain-*' | head -1)
          echo "toolchain in the image: $TC"
          id=$(docker create "$SDK_IMAGE")
          docker cp "$id:$TC" "$PWD/toolchain"
          mkdir -p host && docker cp "$id:/builder/staging_dir/host/lib" "$PWD/host/lib"   # the compiler wrapper looks for ../../host/lib
          docker rm "$id" > /dev/null
          echo "GCC=$(ls "$PWD"/toolchain/bin/*-openwrt-linux-musl-gcc | head -1)" >> "$GITHUB_ENV"

      - name: Rust nightly with the standard-library sources (MIPS has no prebuilt standard library)
        run: rustup toolchain install nightly --profile minimal -c rust-src

      - name: Build
        working-directory: tools/pisoportal
        run: |
          # panic=abort needs no unwinder; satisfy the "-lunwind" the musl targets ask for with the toolchain's own
          mkdir -p "$PWD/stub"
          echo 'INPUT(-lgcc_eh)' > "$PWD/stub/libunwind.a"
          export STAGING_DIR="$GITHUB_WORKSPACE/toolchain"
          export RUSTFLAGS="-C linker=$GCC -C link-arg=-L$PWD/stub -C target-feature=+crt-static -C relocation-model=static -C link-self-contained=no"
          cargo +nightly build --release -Z build-std=std,panic_abort --target mipsel-unknown-linux-musl
          BIN=target/mipsel-unknown-linux-musl/release/pisoportal
          ls -l "$BIN"
          file "$BIN"
          mkdir -p ../../dist && cp "$BIN" ../../dist/pisoportal-mipsel
          (cd ../../dist && sha256sum pisoportal-mipsel | tee pisoportal-mipsel.sha256)
          { echo "pisoportal $(grep -m1 '^version' Cargo.toml | cut -d'"' -f2) for mipsel-unknown-linux-musl, from commit $GITHUB_SHA"
            rustc +nightly -V; echo "C toolchain: $SDK_IMAGE ($("$GCC" --version | head -n 1))"; } | tee ../../dist/BUILD-INFO

      - uses: actions/upload-artifact@v4
        with:
          name: pisoportal-mipsel
          path: dist/

      # The built program goes into the repository too, and the setup file is rebuilt around it.
      - name: Commit the program and the setup file to the branch
        if: github.ref_name == 'beta'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p tools/pisoportal/bin
          cp dist/pisoportal-mipsel dist/pisoportal-mipsel.sha256 dist/BUILD-INFO tools/pisoportal/bin/
          python3 tools/build_piso_setup.py
          git add tools/pisoportal/bin setup/piso-setup.sh setup/piso-setup.sh.sha256 website/install.sh
          git diff --cached --quiet || { git commit -m "ci: built the router program (mipsel_24kc)"; git pull --rebase -q origin "$GITHUB_REF_NAME" && git push; }
