name: Emulator tests

# The real app on an emulated phone (app/src/androidTest): a signed payment goes in over the wire, the phone unlocks, counts down and
# locks itself. An emulator costs about 6 minutes of CI time, so it does not run on every push of every branch:
#   - on a push to main that changes the app,
#   - every night (02:00 UTC) when main changed in the last day (a scheduled run only ever tests main),
#   - by hand for any branch: Actions > Emulator tests > Run workflow, choose the branch.
# It is not yet required for an APK to be built: it becomes a requirement once it has been stable for a while.
on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'scripts/ci_emulator_tests.sh'
      - '.github/workflows/emulator-tests.yml'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emulator-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # A nightly run with nothing new to test costs minutes for nothing: skip it.
  changed:
    name: Anything new to test?
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.look.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: look
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != schedule ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          n=$(git log --since='26 hours ago' --oneline -- app gradle '*.gradle.kts' scripts/ci_emulator_tests.sh | wc -l)
          echo "commits touching the app in the last day: $n"
          if [ "$n" -gt 0 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

  emulator-tests:
    name: Emulator tests
    needs: changed
    if: needs.changed.outputs.run == 'true' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Allow the emulator to use hardware acceleration (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Run the instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/ci_emulator_tests.sh

      - name: Upload the test reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: emulator-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
