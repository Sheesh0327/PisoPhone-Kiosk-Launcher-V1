name: Build and Deploy APK to Website

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: write # Required to push the APK to the website directory

jobs:
  build-and-deploy:
    name: Build APK and Push to Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Production Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing secret 'KEYSTORE_BASE64'. Please add KEYSTORE_BASE64 to your repository GitHub Secrets."
            exit 1
          fi
          echo -n "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d -i > /tmp/release-keystore.jks
          echo "Production keystore successfully decoded from GitHub Secrets."

      - name: Build Release APK
        env:
          KEYSTORE_PATH: /tmp/release-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --no-configuration-cache --stacktrace

      - name: Clean up Keystore
        if: always()
        run: rm -f /tmp/release-keystore.jks

      - name: Push APK directly to website directory
        run: |
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk website/app-release.apk
          else
            echo "Error: No release APK found in app/build/outputs/apk/release/"
            exit 1
          fi
          
          # Calculate file SHA-256 checksum for audit & logs
          FILE_SHA256_HEX=$(sha256sum website/app-release.apk | awk '{print $1}')
          echo "Generated APK SHA-256 (Hex): $FILE_SHA256_HEX"
          
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f website/app-release.apk website/firmware.bin website/firmware.json 2>/dev/null || git add -f website/app-release.apk
          # Only commit if there are changes to avoid failing the workflow
          git diff --staged --quiet || git commit -m "chore: auto-update APK and firmware binaries in website directory [skip ci]"
          git push

