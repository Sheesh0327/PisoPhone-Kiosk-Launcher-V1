name: Build and Deploy APK to Website
# Builds, signs and publishes the APK for the branch that was pushed.

# Every branch publishes its own APK to its own website/update folder:
#   main          -> https://pisophone.pages.dev/update              (production channel)
#   any other     -> https://<branch-alias>.pisophone.pages.dev/update  (dev channel, "-dev" versionName)
# A dev APK only ever checks its own branch's folder, so testing a branch never touches production.
on:
  push:
    branches:
      - '**'
    paths:
      - 'app/**'
      - 'protocol/**'
      - 'tools/pisoportal/owner_key.b64'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write # Required to push the APK to the website directory

# One run per branch at a time (each deploy commits back to its branch); a newer push to a dev
# branch supersedes an older unfinished run, but a production deploy is never cancelled midway.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Run unit tests
        run: bash ./gradlew :app:testDebugUnitTest --no-daemon --no-configuration-cache --stacktrace

      # Room writes a snapshot of each database version to app/schemas while compiling (see app/build.gradle.kts).
      # A version's snapshot must never change once committed: changing the tables without a new version number and a
      # migration makes Room refuse to open the database on phones that already have it. A new version's snapshot is
      # committed back to the branch here, so it is never forgotten.
      - name: Database schema snapshots
        env:
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
        run: |
          if ! git diff --quiet -- app/schemas; then
            echo "::error::A committed database schema changed. Change the Room entities only together with a new database version and a migration."
            git diff --stat -- app/schemas
            exit 1
          fi
          NEW=$(git ls-files --others --exclude-standard -- app/schemas)
          if [ -z "$NEW" ]; then echo "Database schema snapshots are up to date."; exit 0; fi
          echo "New database schema snapshot(s):"; echo "$NEW"
          if [ "$ACTOR" = "dependabot[bot]" ] || [ "$EVENT" != "push" ]; then
            echo "::warning::New schema snapshot not committed (not a push to a branch); commit it from a regular build."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/schemas"
          cp -r app/schemas/. "$RUNNER_TEMP/schemas/"
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git reset -q --hard "origin/$BRANCH"
            mkdir -p app/schemas
            cp -rn "$RUNNER_TEMP/schemas/." app/schemas/
            git add -- app/schemas
            if git diff --staged --quiet; then exit 0; fi
            git commit -q -m "chore: database schema snapshot"
            if git push origin "HEAD:refs/heads/$BRANCH"; then exit 0; fi
            echo "::warning::Push rejected (attempt $attempt); trying again on the newest branch tip."
            sleep $((attempt * 3))
          done
          echo "::error::Could not commit the database schema snapshot."
          exit 1

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/

  build-and-deploy:
    name: Build APK and Push to Website
    needs: unit-tests
    # Dependabot runs get no repository secrets (no signing key), and its branches must never publish an APK.
    # Its pull requests are still checked by the unit tests above and by the Code quality workflow.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Work out release channel
        id: channel
        env:
          BRANCH: ${{ github.ref_name }}
          PAGES_HOST: ${{ vars.PAGES_PRODUCTION_HOST }}
        run: |
          HOST="${PAGES_HOST:-pisophone.pages.dev}"
          if [ "$BRANCH" = "main" ]; then
            CHANNEL=stable
            BASE="https://$HOST/update"
          else
            CHANNEL=dev
            # Cloudflare Pages branch alias: lowercase, non-alphanumerics become '-', cut to 28 chars.
            ALIAS=$(printf '%s' "$BRANCH" | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9]/-/g' | cut -c1-28 | sed 's/^-*//; s/-*$//')
            PROJECT="${HOST%%.*}"
            BASE="https://$ALIAS.$PROJECT.pages.dev/update"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Channel: $CHANNEL, update URL: $BASE"

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Verify signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secret(s):$missing. A release APK signed with a different key cannot update installed phones, so the build is stopped."
            exit 1
          fi

      - name: Decode Production Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo -n "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d -i > /tmp/release-keystore.jks
          echo "Production keystore successfully decoded from GitHub Secrets."

      - name: Build Release APK
        env:
          KEYSTORE_PATH: /tmp/release-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUILD_CHANNEL: ${{ steps.channel.outputs.channel }}
          UPDATE_BASE_URL: ${{ steps.channel.outputs.base }}
        # The runner's GITHUB_RUN_NUMBER becomes versionCode (see app/build.gradle.kts), so every
        # build is newer than the one before it.
        run: bash ./gradlew :app:assembleRelease --no-daemon --no-configuration-cache --stacktrace

      - name: Clean up Keystore
        if: always()
        run: rm -f /tmp/release-keystore.jks

      - name: Publish APK and version info
        env:
          BRANCH: ${{ github.ref_name }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASES_REPO: ${{ vars.RELEASES_REPO || 'Sheesh0327/PisoPhone-Releases' }}
          KEEP_PAGES_APK: ${{ vars.KEEP_PAGES_APK }}
        run: |
          VERSION_NAME="1.0.${{ github.run_number }}"
          if [ "${{ steps.channel.outputs.channel }}" != "stable" ]; then VERSION_NAME="$VERSION_NAME-dev"; fi
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::No release APK found at $APK"
            exit 1
          fi
          # An unsigned or badly signed APK cannot update installed phones; refuse to publish one.
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          SIG_CHECKSUM=""
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt
            # QR-code setup: Android only installs an app whose signing certificate has this SHA-256 (URL-safe base64,
            # no padding); the provisioning page puts it in the code
            # ("Signer #1 certificate SHA-256 digest: <hex>", or "V2 Signer: ..." when the APK has only a v2 signature)
            CERT_SHA=$(sed -n 's/^.*[Ss]igner.* certificate SHA-256 digest: \([0-9a-f]\{64\}\)$/\1/p' /tmp/certs.txt | head -n 1)
            if [ -n "$CERT_SHA" ]; then
              SIG_CHECKSUM=$(python3 -c "import base64,sys; print(base64.urlsafe_b64encode(bytes.fromhex(sys.argv[1])).decode().rstrip('='))" "$CERT_SHA")
              echo "Signing certificate SHA-256: $CERT_SHA (QR checksum $SIG_CHECKSUM)"
            else
              echo "::warning::no signing certificate SHA-256 in apksigner's output: this build cannot be set up by QR code"
            fi
          else
            echo "::warning::apksigner not found; skipping signature verification (and no QR setup checksum)."
          fi
          mkdir -p website/update

          SHA=$(sha256sum "$APK" | awk '{print $1}')
          SIZE=$(stat -c %s "$APK")
          echo "Generated APK SHA-256: $SHA ($SIZE bytes)"

          # The APK goes to a separate PUBLIC releases repository (this repository is private, and phones
          # cannot log in to download from it). Needs the RELEASES_TOKEN secret; see docs/DEPLOY.md.
          URL=""
          if [ -n "$RELEASES_TOKEN" ]; then
            CHANNEL="${{ steps.channel.outputs.channel }}"
            TAG="app-$CHANNEL-${{ github.run_number }}"
            ASSET="pisophone-$VERSION_NAME.apk"
            cp "$APK" "/tmp/$ASSET"
            PRE=""
            if [ "$CHANNEL" != "stable" ]; then PRE="--prerelease"; fi
            GH_TOKEN="$RELEASES_TOKEN" gh release create "$TAG" "/tmp/$ASSET" --repo "$RELEASES_REPO" \
              --title "PisoPhone $VERSION_NAME" $PRE \
              --notes "Built from $GITHUB_SHA on branch $BRANCH. SHA-256: $SHA"
            URL="https://github.com/$RELEASES_REPO/releases/download/$TAG/$ASSET"
            echo "Published release asset: $URL"
            # Keep only the 20 newest dev builds.
            GH_TOKEN="$RELEASES_TOKEN" gh release list --repo "$RELEASES_REPO" --limit 200 --json tagName,createdAt \
              -q '[.[] | select(.tagName | startswith("app-dev-"))] | sort_by(.createdAt) | reverse | .[20:] | .[].tagName' \
              | xargs -r -n1 env GH_TOKEN="$RELEASES_TOKEN" gh release delete --repo "$RELEASES_REPO" --cleanup-tag --yes || true
          else
            echo "::warning::RELEASES_TOKEN is not set: the APK is committed to website/update instead (see docs/DEPLOY.md)."
          fi

          # Phones running a build from before the 'url' field existed still download website/update/app-release.apk,
          # so it stays published until you set the repository variable KEEP_PAGES_APK to 'false'.
          PUBLISH_APK=0
          if [ -z "$URL" ] || [ "$KEEP_PAGES_APK" != "false" ]; then PUBLISH_APK=1; fi

          # Version info the in-app updater compares against; it is produced from the same
          # run number that was baked into the APK as versionCode.
          URL_LINE=""
          if [ -n "$URL" ]; then URL_LINE="\"url\": \"$URL\","; fi
          SIG_LINE=""
          if [ -n "$SIG_CHECKSUM" ]; then SIG_LINE="\"signatureChecksum\": \"$SIG_CHECKSUM\","; fi
          cat > website/update/app.json <<EOF
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "$VERSION_NAME",
            "channel": "${{ steps.channel.outputs.channel }}",
            $URL_LINE
            $SIG_LINE
            "sha256": "$SHA",
            "size": $SIZE,
            "releaseDate": "$(date -u +%Y-%m-%d)"
          }
          EOF
          python3 -m json.tool website/update/app.json > /dev/null

          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # The two generated files are the only thing this commit changes, so there is nothing to merge: if the
          # branch moved while we were building (another push, another bot commit), start again from its newest
          # tip, put our two files on it and push. Retry a few times if another push wins the race.
          cp website/update/app.json "$RUNNER_TEMP/app.json"
          published=0
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git reset -q --hard "origin/$BRANCH"
            cp "$RUNNER_TEMP/app.json" website/update/app.json
            git add -f website/update/app.json
            if [ "$PUBLISH_APK" = 1 ]; then
              cp "$APK" website/update/app-release.apk
              git add -f website/update/app-release.apk
            else
              git rm -q -f --ignore-unmatch website/update/app-release.apk
            fi
            if git diff --staged --quiet; then published=1; break; fi
            # No [skip ci] marker: Cloudflare Pages honours it and would never deploy this commit.
            # This commit only touches website/update, which no workflow trigger matches, so it
            # cannot start another build.
            git commit -q -m "chore: publish ${{ steps.channel.outputs.channel }} APK build ${{ github.run_number }}"
            if git push origin "HEAD:refs/heads/$BRANCH"; then published=1; break; fi
            echo "::warning::Push rejected (attempt $attempt); trying again on the newest branch tip."
            sleep $((attempt * 3))
          done
          [ "$published" = 1 ] || { echo "::error::Could not publish the APK after 5 attempts."; exit 1; }
