name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write # Required to create a GitHub Release

jobs:
  build-and-release:
    name: Build and Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Production Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing secret 'KEYSTORE_BASE64'. Please add KEYSTORE_BASE64 to your repository GitHub Secrets."
            exit 1
          fi
          echo -n "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d -i > /tmp/release-keystore.jks
          echo "Production keystore successfully decoded from GitHub Secrets."

      - name: Build Release APK
        env:
          KEYSTORE_PATH: /tmp/release-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --no-configuration-cache --stacktrace

      - name: Clean up Keystore
        if: always()
        run: rm -f /tmp/release-keystore.jks

      - name: Copy APK to website directory and commit
        run: |
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk website/app-release.apk
          else
            echo "Error: No release APK found in app/build/outputs/apk/release/"
            exit 1
          fi
          
          # Calculate file SHA-256 checksum for audit & logs
          FILE_SHA256_HEX=$(sha256sum website/app-release.apk | awk '{print $1}')
          echo "Generated APK SHA-256 (Hex): $FILE_SHA256_HEX"
          
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add website/app-release.apk
          # Only commit if there are changes to avoid failing the workflow
          git diff --staged --quiet || git commit -m "chore: auto-update APK in website directory"
          git push

      - name: Publish Versioned and Rolling Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_TAG="v1.0.${{ github.run_number }}"
          
          # Create a versioned release (so we have rollback points)
          gh release create "$VERSION_TAG" website/app-release.apk \
            --title "Release $VERSION_TAG" \
            --notes "Automated versioned release from the main branch."
            
          # Update the 'latest' rolling release
          gh release delete latest --cleanup-tag -y || true
          
          gh release create latest website/app-release.apk \
            --title "Latest Android Build" \
            --notes "Automated rolling release. See $VERSION_TAG for the specific version."
