name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write # Required to create a GitHub Release

jobs:
  build-and-release:
    name: Build and Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Copy APK to website directory and commit
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk website/app-debug.apk
          
          # Calculate file SHA-256 checksum for audit & logs
          FILE_SHA256_HEX=$(sha256sum website/app-debug.apk | awk '{print $1}')
          echo "Generated APK SHA-256 (Hex): $FILE_SHA256_HEX"
          
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add website/app-debug.apk
          # Only commit if there are changes to avoid failing the workflow
          git diff --staged --quiet || git commit -m "chore: auto-update APK in website directory"
          git push

      - name: Publish Rolling Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete the old 'latest' release and tag so we can overwrite it
          gh release delete latest --cleanup-tag -y || true
          
          # Create a new 'latest' release and upload the fresh APK
          gh release create latest app/build/outputs/apk/debug/app-debug.apk \
            --title "Latest Android Build" \
            --notes "Automated rolling release from the main branch."
