name: Auto-Update Firmware Metadata JSON

on:
  push:
    branches:
      - main
    paths:
      - 'website/update/firmware.bin'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-firmware-json:
    name: Update firmware.json Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Extract commit message
        id: commit_msg
        run: |
          MSG=$(git log -1 --pretty=%B)
          echo "COMMIT_MSG=$MSG" >> $GITHUB_ENV

      - name: Update firmware.json
        run: |
          python3 scripts/update_firmware_json.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add website/update/firmware.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update firmware.json version tracking [skip ci]"
            git pull --rebase --autostash origin main || git pull --rebase --autostash origin ${GITHUB_REF_NAME:-main}
            git push
          fi
