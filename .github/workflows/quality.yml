name: Code quality

# Runs on every push to any branch that touches code, scripts or this file. Everything that does not need a phone, a box
# or a router:
#   - repository security rules, vendored-file record, the setup page's helpers and the page itself in a browser
#   - ktlint (Kotlin, rules in .editorconfig); the Android unit tests and build run in build-apk.yml
#   - clang-format, protocol vectors, generated web assets and the host tests of the firmware; the firmware compiled
#     for every board and the two production (encrypted) builds
#   - the router portal (pisoportal): rustfmt, clippy, unit tests, end-to-end and real-browser tests; the router setup
#     file and the Telegram monitor; shellcheck. The router build itself runs in router-program.yml
on:
  push:
    branches:
      - '**'
    paths:
      - 'app/**'
      - 'protocol/**'
      - 'esp32_firmware/**'
      - 'scripts/**'
      - 'router/**'
      - 'setup/**'
      - 'tools/build_piso_setup.py'
      - 'tools/pisoportal/src/**'
      - 'tools/pisoportal/tests/**'
      - 'tools/pisoportal/Cargo.*'
      - 'tools/pisoportal/owner_key.b64'
      - 'tools/pisoportal/rustfmt.toml'
      - 'tools/site-css/**'
      - 'website/index.html'
      - 'website/_headers'
      - 'website/css/**'
      - 'website/js/**'
      - '.editorconfig'
      - '.github/workflows/quality.yml'
  pull_request:

permissions:
  contents: read

jobs:
  security-rules:
    name: Security rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository security rules
        run: sh scripts/check_security_rules.sh
      - name: Check vendored files match their record
        run: python3 scripts/check_vendored.py

  website:
    name: Provisioning website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The setup page's provisioning helpers (validation, shell quoting, the box's link)
        run: node scripts/test_provisioning.js
      - name: The stylesheet matches the page (built from its classes; no third-party script on the page)
        working-directory: tools/site-css
        run: |
          npm ci --no-audit --no-fund
          npm run build
          git diff --exit-code ../../website/css || { echo "::error::website/css/app.css is out of date: cd tools/site-css && npm ci && npm run build"; exit 1; }
      - name: The page in a browser, with the site's Content-Security-Policy
        run: |
          pip install -q playwright && playwright install --with-deps chromium
          python3 scripts/tests/test_site_page.py

  kotlin-style:
    name: ktlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install ktlint
        run: |
          curl -sSL -o ktlint https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint
          chmod +x ktlint
      - name: Check Kotlin style
        run: ./ktlint --relative "app/src/**/*.kt" "*.kts" "app/*.kts"

  firmware-style-and-tests:
    name: Firmware format and host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libmbedtls-dev
          pip install clang-format==23.1.2 cryptography
      - name: Check C++ formatting
        working-directory: esp32_firmware
        run: |
          FILES=$(ls src/*.cpp include/*.h host_tests/*.cpp | grep -vE "include/(WebDashboard|SuperAdminTemplate|WebAssets)")
          clang-format --dry-run --Werror $FILES
      - name: Check protocol test vectors are reproducible
        run: |
          python3 protocol/gen_vectors.py
          git diff --exit-code protocol
      - name: Check generated web assets are up to date
        run: python3 scripts/embed_web.py --check
      - name: Run host tests
        run: sh esp32_firmware/host_tests/run.sh
      - name: Test the sold-unit checker
        run: python3 scripts/tests/test_sold_unit_check.py

  firmware-build:
    name: Firmware build (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [esp32-c3-dev, esp32dev-dev, esp32-c3-production-encrypted, esp32dev-production-encrypted]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
          key: pio-${{ matrix.env }}-${{ hashFiles('esp32_firmware/platformio.ini', 'esp32_firmware/envs/*.ini') }}
      - name: Install PlatformIO
        run: pip install platformio==6.2.0
      - name: Compile
        working-directory: esp32_firmware
        run: pio run -e ${{ matrix.env }}
      - name: Owner keys built in (production builds)
        if: contains(matrix.env, 'production')
        working-directory: esp32_firmware/include
        run: |
          # Not an error while the owner has not made the keys (docs/KEYS.md), but never silent: until then a box accepts
          # unsigned firmware updates and old shared-secret licenses.
          for f in LicensePubKey.h SuperAdminPubKey.h; do
            if grep -q '_LEN = 0;' "$f"; then echo "::warning file=esp32_firmware/include/$f::$f still holds the placeholder: this production build accepts unsigned firmware/credentials (see docs/KEYS.md)"; fi
          done

  pisoportal:
    name: Portal program and router setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright (real-browser test), BusyBox (the router's shell and tools), ShellCheck and the Rust lints
        run: |
          pip install -q playwright cryptography && playwright install --with-deps chromium
          sudo apt-get install -y -q busybox-static
          rustup component add rustfmt clippy
          # one ShellCheck version everywhere (the runner's own changes with the image)
          curl -fsSLo /tmp/sc.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/sc.tar.xz" | sha256sum -c -
          tar -xJf /tmp/sc.tar.xz -C /tmp && sudo install -m 755 /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version
      - name: pisoportal style and lints
        working-directory: tools/pisoportal
        run: |
          cargo fmt --check
          cargo clippy --locked --release --all-targets -- -D warnings
      - name: Build and test pisoportal (host build; the router build is in router-program.yml)
        working-directory: tools/pisoportal
        run: |
          cargo build --locked --release
          cargo test --locked --release
          python3 tests/test_flow.py
          CHROME=$(ls ~/.cache/ms-playwright/chromium-*/chrome-linux*/chrome | head -1) python3 tests/test_browser.py
      - name: Shell scripts (shellcheck)
        run: |
          shellcheck -s sh setup/piso-setup.sh.in router/piso_monitor.sh
          shellcheck -s sh -e SC2034 router/*.init
      - name: Check the one-file router setup (settings, payload, box provisioning)
        run: python3 router/tests/test_setup.py
      - name: Check the Telegram monitor against a fake Telegram
        run: python3 router/tests/test_monitor.py
      - name: Check router updates from the website (signed releases only, staged rollout, undo of a release that does not run)
        run: |
          python3 router/tests/test_selfupdate.py
          # not an error while the owner has not made the keys (docs/KEYS.md), but never silent: routers install no update until then
          if [ ! -s tools/pisoportal/owner_key.b64 ]; then echo "::warning file=tools/pisoportal/owner_key.b64::no owner key built into the router program: routers will install no update from the website (docs/RELEASE.md)"; fi
      - name: The committed setup file is up to date
        run: python3 tools/build_piso_setup.py --check
