name: Code quality

# Runs on every push to any branch that touches code, scripts or this file.
# Style and logic checks that do not need the Android toolchain or an ESP32 board:
#   - ktlint for the Android app (rules in .editorconfig)
#   - clang-format for the firmware (rules in esp32_firmware/.clang-format)
#   - the firmware's host tests (diagnostics ring, input safety, OTA header check, credential, license and money code)
#   - repository security rules (scripts/check_security_rules.sh)
on:
  push:
    branches:
      - '**'
    paths:
      - 'app/**'
      - 'protocol/**'
      - 'esp32_firmware/**'
      - 'scripts/**'
      - 'opennds/**'
      - 'setup/**'
      - 'tools/build_piso_setup.py'
      - 'website/js/**'
      - '.editorconfig'
      - '.github/workflows/quality.yml'
  pull_request:

permissions:
  contents: read

jobs:
  security-rules:
    name: Security rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository security rules
        run: sh scripts/check_security_rules.sh
      - name: Check vendored files match their record
        run: python3 scripts/check_vendored.py

  kotlin-style:
    name: ktlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install ktlint
        run: |
          curl -sSL -o ktlint https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint
          chmod +x ktlint
      - name: Check Kotlin style
        run: ./ktlint --relative "app/src/**/*.kt" "*.kts" "app/*.kts"

  firmware-style-and-tests:
    name: Firmware format and host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libmbedtls-dev
          pip install clang-format cryptography
      - name: Check C++ formatting
        working-directory: esp32_firmware
        run: |
          FILES=$(ls src/*.cpp include/*.h host_tests/*.cpp | grep -vE "include/(WebDashboard|SuperAdminTemplate|WebAssets)")
          clang-format --dry-run --Werror $FILES
      - name: Check protocol test vectors are reproducible
        run: |
          python3 protocol/gen_vectors.py
          git diff --exit-code protocol
      - name: Check generated web assets are up to date
        run: python3 scripts/embed_web.py --check
      - name: Run host tests
        run: sh esp32_firmware/host_tests/run.sh
      - name: Test the sold-unit checker
        run: python3 scripts/tests/test_sold_unit_check.py

  firmware-build:
    name: Firmware build (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [esp32-c3-dev, esp32dev-dev, esp32-c3-production-encrypted, esp32dev-production-encrypted]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
          key: pio-${{ matrix.env }}-${{ hashFiles('esp32_firmware/platformio.ini', 'esp32_firmware/envs/*.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Compile
        working-directory: esp32_firmware
        run: pio run -e ${{ matrix.env }}

  opennds-integration:
    name: OpenNDS integration test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install socat (the router uses it for every call, so the test must too) and Playwright (real-time tap tests)
        run: |
          sudo apt-get install -y -q socat
          pip install -q playwright
      - name: Run end-to-end test with a fake box
        run: python3 opennds/tests/test_flow.py
      - name: Check the one-file router setup (settings, payload, box provisioning)
        run: python3 opennds/tests/test_setup.py
      - name: Run the flash coin portal test (green theme, roll file, pause, fair use)
        run: python3 opennds/tests/test_flash_coin.py
      - name: Check the shell-only request signing against a reference
        run: python3 opennds/tests/test_hmac.py
      - name: Check the Layout B router configuration
        run: python3 opennds/tests/test_layout_b.py
      - name: Check UCI settings and migration
        run: python3 opennds/tests/test_uci_config.py
      - name: Build and check the router package
        run: |
          python3 opennds/tests/test_ipk.py
          python3 opennds/package/build_ipk.py --version 1.0.0-r${{ github.run_number }} --out dist
      - name: Keep the router package from this run
        uses: actions/upload-artifact@v4
        with:
          name: opennds-coinslot-ipk
          path: dist/*.ipk
