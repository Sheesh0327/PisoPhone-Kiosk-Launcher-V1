name: Code quality

# Runs on pushes to main and beta, and on pull requests into main or beta (a pull request from beta or main itself is skipped:
# its push already ran), when code, scripts or this file changed. A "What changed" job reads the list of changed files
# and the jobs below run only for the parts that changed (a firmware build is skipped by a change to the portal, and so on),
# so no runner time is spent on what a change cannot affect. A newer push to the same branch cancels the unfinished run.
# Everything that does not need a phone, a box or a router:
#   - repository security rules (always), vendored-file record, the setup page's helpers and the page itself in a browser
#   - ktlint (Kotlin, rules in .editorconfig); the Android unit tests and build run in build-apk.yml
#   - clang-format, protocol vectors, generated web assets and the host tests of the firmware; the firmware compiled
#     for every board and the two production (encrypted) builds
#   - the router portal (pisoportal): rustfmt, clippy, unit tests, end-to-end and real-browser tests; the router setup
#     file and the Telegram monitor; shellcheck. The router build itself runs in router-program.yml
on:
  push:
    branches:
      - main
      - beta
    paths:
      - 'app/**'
      - 'protocol/**'
      - 'esp32_firmware/**'
      - 'scripts/**'
      - 'router/**'
      - 'setup/**'
      - 'tools/build_piso_setup.py'
      - 'tools/pisoportal/src/**'
      - 'tools/pisoportal/tests/**'
      - 'tools/pisoportal/Cargo.*'
      - 'tools/pisoportal/owner_key.b64'
      - 'tools/pisoportal/rustfmt.toml'
      - 'website/index.html'
      - 'website/_headers'
      - 'website/install.sh'
      - 'website/pisophone_setup.py'
      - 'website/css/**'
      - 'website/js/**'
      - '.editorconfig'
      - '.github/workflows/quality.yml'
  pull_request:
    branches:
      - main
      - beta
    paths:
      - 'app/**'
      - 'protocol/**'
      - 'esp32_firmware/**'
      - 'scripts/**'
      - 'router/**'
      - 'setup/**'
      - 'tools/build_piso_setup.py'
      - 'tools/pisoportal/src/**'
      - 'tools/pisoportal/tests/**'
      - 'tools/pisoportal/Cargo.*'
      - 'tools/pisoportal/owner_key.b64'
      - 'tools/pisoportal/rustfmt.toml'
      - 'website/index.html'
      - 'website/_headers'
      - 'website/install.sh'
      - 'website/pisophone_setup.py'
      - 'website/css/**'
      - 'website/js/**'
      - '.editorconfig'
      - '.github/workflows/quality.yml'

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      firmware_build: ${{ steps.flags.outputs.firmware_build }}
      firmware_tests: ${{ steps.flags.outputs.firmware_tests }}
      portal: ${{ steps.flags.outputs.portal }}
      website: ${{ steps.flags.outputs.website }}
      kotlin: ${{ steps.flags.outputs.kotlin }}
      security: ${{ steps.flags.outputs.security }}
    steps:
      - id: flags
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # (a change to this file runs every job: that is how the whole suite is run on purpose)
          files=""
          if [ "$EVENT" = pull_request ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            # (after a history rewrite the old commit is unrelated to the new one and the lookup fails: then everything runs)
            files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --paginate --jq '.files[].filename') || files=""
          fi
          all=""
          [ -n "$files" ] || { echo "no list of changed files (new branch or a lookup failure): running everything"; all=1; }
          # main is what ships: every job runs there, whatever the push touched. A branch runs only the jobs its change can affect.
          if [ "$EVENT" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then echo "push to main: running everything"; all=1; fi
          skip=""
          if [ "$EVENT" = pull_request ] && { [ "$HEAD_REF" = beta ] || [ "$HEAD_REF" = main ]; }; then echo "this pull request's branch was checked by its own push"; skip=1; fi
          flag() {  # flag <output name> <regex of the paths that matter>
            if [ -n "$skip" ]; then v=false
            elif [ -n "$all" ] || printf '%s\n' "$files" | grep -Eq "$2"; then v=true
            else v=false; fi
            echo "$1=$v" | tee -a "$GITHUB_OUTPUT"
          }
          W='\.github/workflows/quality\.yml'
          flag security '.'
          flag kotlin "^(app/|[^/]*\.kts$|\.editorconfig|detekt\.yml|detekt-baseline\.xml|$W)"
          flag firmware_build "^(esp32_firmware/|protocol/|$W)"
          flag firmware_tests "^(esp32_firmware/|protocol/|scripts/|$W)"
          flag portal "^(tools/pisoportal/|router/|setup/|website/install\.sh|website/pisophone_setup\.py|tools/build_piso_setup\.py|scripts/(sign_router|owner_key|make_owner_keys)\.py|$W)"
          flag website "^(website/|esp32_firmware/web/(adminqr|jsqr)\.js|scripts/(make_admin_qr\.py|tests/test_admin_qr\.py|make_wifi_poster\.py|tests/test_make_wifi_poster\.py|tests/test_manual\.py|tests/test_start_pages\.py|make_firmware_bundles\.py|tests/test_make_firmware_bundles\.py)|esp32_firmware/partitions_encrypted\.csv|docs/PROVISIONING_SOLD_UNIT\.md|scripts/check_published_apk\.py|scripts/tests/test_check_published_apk\.py|app/src/main/java/com/pisophone/kiosk/(security/KioskSecurity|network/KioskWifi|provisioning/QrProvisioning)\.kt|scripts/tests/test_provisioning\.js|scripts/tests/test_site_page\.py|scripts/check_vendored\.py|$W)"

  security-rules:
    name: Security rules
    needs: changes
    if: needs.changes.outputs.security == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check repository security rules
        run: sh scripts/check_security_rules.sh
      - name: Check vendored files match their record
        run: python3 scripts/check_vendored.py
      - name: Check that no document links to a file that is gone
        run: python3 scripts/tests/test_check_links.py && python3 scripts/check_links.py

  website:
    name: Provisioning website
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: The setup page's provisioning helpers (validation, shell quoting, the box's link, the QR code)
        run: |
          node scripts/tests/test_provisioning.js
      - name: The published APK is the one app.json describes (QR setup needs the signing certificate to match)
        run: |
          python3 scripts/check_published_apk.py
          python3 scripts/tests/test_check_published_apk.py
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0
      - name: The page in a browser, with the site's Content-Security-Policy
        run: |
          pip install -q playwright==1.63.0 zxing-cpp==2.3.0 pillow==11.3.0 cryptography qrcode && playwright install --with-deps chromium
          python3 scripts/tests/test_site_page.py
      - name: The owner's admin QR login (the key and QR code script, the browser code that signs, reading a photo of the code)
        run: python3 scripts/tests/test_admin_qr.py
      - name: The console page's signed script (the signer and the browser-side check)
        run: python3 scripts/tests/test_console_ui.py
      - name: Firmware zips (layout checks, no keys inside)
        run: python3 scripts/tests/test_make_firmware_bundles.py
      - name: The owner's manual page (links, nothing loaded from outside, print rules) and the Wi-Fi poster maker
        run: |
          python3 scripts/tests/test_manual.py
          python3 scripts/tests/test_make_wifi_poster.py
      - name: The Start here pages (links, six steps at most, nothing loaded from outside, no keys for the owner)
        run: python3 scripts/tests/test_start_pages.py

  kotlin-style:
    name: ktlint
    needs: changes
    if: needs.changes.outputs.kotlin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install ktlint
        run: |
          curl -sSL -o ktlint https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint
          chmod +x ktlint
      - name: Check Kotlin style
        run: ./ktlint --relative "app/src/**/*.kt" "*.kts" "app/*.kts"

  kotlin-analysis:
    name: detekt
    needs: changes
    if: needs.changes.outputs.kotlin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install detekt (checked against a known hash)
        run: |
          curl -sSL -o detekt.jar https://github.com/detekt/detekt/releases/download/v1.23.8/detekt-cli-1.23.8-all.jar
          echo "2ce2ff952e150baf28a29cda70a363b0340b3e81a55f43e51ec5edffc3d066c1  detekt.jar" | sha256sum -c -
      # detekt.yml says what is checked; detekt-baseline.xml holds what already existed. Anything new fails here.
      - name: Static analysis of the app
        run: java -jar detekt.jar --config detekt.yml --build-upon-default-config --baseline detekt-baseline.xml --input app/src/main/java

  firmware-style-and-tests:
    name: Firmware format and host tests
    needs: changes
    if: needs.changes.outputs.firmware_tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libmbedtls-dev
          pip install clang-format==23.1.2 cryptography
      - name: Check C++ formatting
        working-directory: esp32_firmware
        run: |
          FILES=$(ls src/*.cpp include/*.h host_tests/*.cpp | grep -vE "include/(WebDashboard|SuperAdminTemplate|WebAssets)")
          clang-format --dry-run --Werror $FILES
      - name: Check protocol test vectors are reproducible
        run: |
          python3 protocol/gen_vectors.py
          python3 protocol/gen_voice_vectors.py
          git diff --exit-code protocol
      - name: Check the voice message reference (feature 056)
        run: |
          pip install -q pytest
          python3 -m pytest -x -q protocol/test_voice_vectors.py
      - name: Check generated web assets are up to date
        run: python3 scripts/embed_web.py --check
      - name: Check that each product image holds no word of the other product
        run: python3 scripts/check_product_strip.py
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0
      - name: The dashboard's own scripts in a browser
        run: |
          pip install -q playwright==1.63.0 && playwright install --with-deps chromium
          python3 scripts/tests/test_portal_orphans_ui.py
          python3 scripts/tests/test_portal_session_ui.py
          python3 scripts/tests/test_portal_theme_ui.py
          python3 scripts/tests/test_portal_license_ui.py
          python3 scripts/tests/test_portal_voice_ui.py
      - name: Run host tests
        run: sh esp32_firmware/host_tests/run.sh
      - name: Test the sold-unit checker
        run: python3 scripts/tests/test_sold_unit_check.py
      - name: Test the recovery code tool, the QR card printer and the firmware publisher
        run: |
          pip install qrcode pillow
          python3 scripts/tests/test_recovery_code.py
          python3 scripts/tests/test_make_cards.py
          python3 scripts/tests/test_publish_firmware.py
          python3 scripts/tests/test_make_brand_pack.py

  firmware-build:
    name: Firmware build (${{ matrix.env }})
    needs: changes
    if: needs.changes.outputs.firmware_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [esp32-c3-dev, esp32dev-dev, esp32-c3-production-encrypted, esp32dev-production-encrypted]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.platformio
          key: pio-${{ matrix.env }}-${{ hashFiles('esp32_firmware/platformio.ini', 'esp32_firmware/envs/*.ini') }}
      - name: Install PlatformIO
        run: pip install platformio==6.2.0
      - name: Compile
        working-directory: esp32_firmware
        run: pio run -e ${{ matrix.env }}
      - name: Owner keys built in (production builds)
        if: contains(matrix.env, 'production')
        working-directory: esp32_firmware/include
        run: |
          # Not an error while the owner has not made the keys (docs/KEYS.md), but never silent: until then a box accepts
          # unsigned firmware updates.
          for f in LicensePubKey.h SuperAdminPubKey.h; do
            if grep -q '_LEN = 0;' "$f"; then echo "::warning file=esp32_firmware/include/$f::$f still holds the placeholder: this production build accepts unsigned firmware/credentials (see docs/KEYS.md)"; fi
          done

  pisoportal:
    name: Portal program and router setup
    needs: changes
    if: needs.changes.outputs.portal == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/pisoportal/target
            ~/test-target
          key: rust-${{ hashFiles('tools/pisoportal/Cargo.lock') }}
          restore-keys: rust-
      - name: Install Playwright (real-browser test), BusyBox (the router's shell and tools), ShellCheck and the Rust lints
        run: |
          pip install -q playwright==1.63.0 cryptography zxing-cpp==2.3.0 pillow==11.3.0 && playwright install --with-deps chromium
          sudo apt-get install -y -q busybox-static
          rustup component add rustfmt clippy
          # one ShellCheck version everywhere (the runner's own changes with the image)
          curl -fsSLo /tmp/sc.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/sc.tar.xz" | sha256sum -c -
          tar -xJf /tmp/sc.tar.xz -C /tmp && sudo install -m 755 /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version
      - name: pisoportal style and lints
        working-directory: tools/pisoportal
        run: |
          cargo fmt --check
          cargo clippy --locked --release --all-targets -- -D warnings
      - name: Build and test pisoportal (host build; the router build is in router-program.yml)
        working-directory: tools/pisoportal
        run: |
          cargo build --locked --release
          cargo test --locked --release
          python3 tests/test_flow.py
          python3 tests/test_console.py
          python3 tests/test_console_sqm.py
          python3 tests/test_pricing_flow.py
          python3 tests/test_link_loss.py
          python3 tests/test_money_panel.py
          python3 tests/test_versions_panel.py
          CHROME=$(ls ~/.cache/ms-playwright/chromium-*/chrome-linux*/chrome | head -1) python3 tests/test_browser.py
          CHROME=$(ls ~/.cache/ms-playwright/chromium-*/chrome-linux*/chrome | head -1) python3 tests/test_page_golden.py
          python3 tests/test_brand_public.py
          CHROME=$(ls ~/.cache/ms-playwright/chromium-*/chrome-linux*/chrome | head -1) python3 tests/test_page_branded.py
          CHROME=$(ls ~/.cache/ms-playwright/chromium-*/chrome-linux*/chrome | head -1) python3 tests/test_page_layouts.py
          CHROME=$(ls ~/.cache/ms-playwright/chromium-*/chrome-linux*/chrome | head -1) python3 tests/test_page_languages.py
          CHROME=$(ls ~/.cache/ms-playwright/chromium-*/chrome-linux*/chrome | head -1) python3 tests/test_console_loader.py
          CHROME=$(ls ~/.cache/ms-playwright/chromium-*/chrome-linux*/chrome | head -1) python3 tests/test_console_prices.py
          CHROME=$(ls ~/.cache/ms-playwright/chromium-*/chrome-linux*/chrome | head -1) python3 tests/test_console_frame.py
          CHROME=$(ls ~/.cache/ms-playwright/chromium-*/chrome-linux*/chrome | head -1) python3 tests/test_send.py
      - name: Shell scripts (shellcheck)
        run: |
          shellcheck -s sh setup/piso-setup.sh.in router/piso_monitor.sh router/piso_isolation.sh
          shellcheck -s sh -e SC2034 router/*.init
      - name: Check the one-file router setup (settings, payload, box provisioning)
        run: python3 router/tests/test_setup.py
      - name: Check the package-manager layer (opkg, apk or none; official, fork or custom image) and the flags it must never use
        run: |
          python3 router/tests/test_pkgmgr.py
          python3 router/tests/test_optional.py
          python3 router/tests/test_sqm.py
          python3 router/tests/test_sqm_test.py
          python3 scripts/tests/test_package_flags.py
      - name: Footprint budget (a small router must fit)
        run: python3 router/tests/test_footprint.py
      - name: Check the one-line installer (download check, moving the router to 10.0.0.1; also under BusyBox ash)
        run: python3 router/tests/test_install.py
      - name: Check the router setup run from a computer (setup/pisophone_setup.py, against a fake ssh and router)
        run: python3 router/tests/test_pisophone_setup.py
      - name: Check the setup page (this computer and what it installs, the PIN and the server, every step in a phone-sized browser)
        run: |
          CHROME=$(ls ~/.cache/ms-playwright/chromium-*/chrome-linux*/chrome | head -1) python3 router/tests/test_setup_web.py
          CHROME=$(ls ~/.cache/ms-playwright/chromium-*/chrome-linux*/chrome | head -1) python3 router/tests/test_setup_tools.py
          CHROME=$(ls ~/.cache/ms-playwright/chromium-*/chrome-linux*/chrome | head -1) python3 router/tests/test_setup_phone_web.py
          python3 router/tests/test_phone_only.py
      - name: Check the Telegram monitor against a fake Telegram
        run: python3 router/tests/test_monitor.py
      - name: Check router updates from the website (signed releases only, staged rollout, undo of a release that does not run)
        run: |
          PISO_TEST_TARGET_DIR=$HOME/test-target python3 router/tests/test_selfupdate.py
          PISO_TEST_TARGET_DIR=$HOME/test-target python3 tools/pisoportal/tests/test_brand_pack.py
          CHROME=$(ls ~/.cache/ms-playwright/chromium-*/chrome-linux*/chrome | head -1) PISO_TEST_TARGET_DIR=$HOME/test-target python3 tools/pisoportal/tests/test_console_brand.py
          CHROME=$(ls ~/.cache/ms-playwright/chromium-*/chrome-linux*/chrome | head -1) PISO_TEST_TARGET_DIR=$HOME/test-target python3 tools/pisoportal/tests/test_console_layout.py
          # not an error while the owner has not made the keys (docs/KEYS.md), but never silent: routers install no update until then
          if [ ! -s tools/pisoportal/owner_key.b64 ]; then echo "::warning file=tools/pisoportal/owner_key.b64::no owner key built into the router program: routers will install no update from the website (docs/RELEASE.md)"; fi
      - name: Check the coin box's firmware updates through the router (against a fake website and a fake box)
        run: python3 router/tests/test_boxupdate.py
      - name: The committed setup file is up to date
        run: python3 tools/build_piso_setup.py --check
