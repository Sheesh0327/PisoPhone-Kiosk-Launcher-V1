name: Claude (implement issues)

# The implementer side of CLAUDE.md's Architect-Implementer workflow.
#
# Claude Code runs when someone with write access to this repository:
#   - opens an issue whose title or body contains @claude,
#   - comments @claude on an issue or pull request (or in a pull request review),
#   - or adds the label "claude" to an issue.
# The model is Sonnet unless the issue or pull request has the label model:haiku or model:opus (see CLAUDE.md).
# Claude works on a new branch made from beta (claude/issue-<n>-...), runs the issue's Verification commands, pushes, and
# links the pull request into beta from its comment on the issue. Nothing reaches main without the usual beta -> main merge.
#
# Needs, once (see docs/DEPLOY.md):
#   - the Claude GitHub App installed on this repository (https://github.com/apps/claude),
#   - the repository secret CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`) or ANTHROPIC_API_KEY.
# GitHub runs issue and comment workflows from the default branch, so this file only takes effect once it is on main.

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# One implementer at a time for the whole repository, so runs never edit the same files in parallel. GitHub keeps one
# run waiting behind the running one; a third request replaces the waiting one, so dispatch one issue at a time (CLAUDE.md).
concurrency:
  group: claude-implementer
  cancel-in-progress: false

jobs:
  claude:
    # Only people who can already push may start a run (the action checks write access again); a bot never can.
    if: >-
      (
        (github.event_name == 'issues' && github.event.action == 'opened' &&
          (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
        (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude') ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The tools the issues' Verification commands use (the same versions as quality.yml and build-apk.yml).
      - name: Set up JDK 17 (Android build)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: claude-tools-${{ hashFiles('esp32_firmware/platformio.ini', 'esp32_firmware/envs/*.ini') }}

      - name: Install firmware, router and lint tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libmbedtls-dev shellcheck
          pip install -q platformio==6.2.0 clang-format==23.1.2 cryptography pyyaml pytest
          curl -sSL -o ktlint https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint
          chmod +x ktlint
          # ./ktlint is used by the issues' Verification commands; keep it out of commits
          echo ktlint >> .git/info/exclude

      - name: Pick the model
        id: model
        env:
          ISSUE_LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          labels="$ISSUE_LABELS $PR_LABELS"
          model=claude-sonnet-5-5
          case "$labels" in
            *'"model:opus"'*) model=claude-opus-5-5 ;;
            *'"model:haiku"'*) model=claude-haiku-5-5 ;;
          esac
          echo "Implementer model: $model"
          echo "name=$model" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: claude
          base_branch: beta
          branch_prefix: claude/
          additional_permissions: |
            actions: read
          # Large generated and binary files cost a whole run's budget to read and must never be edited by hand
          # (CLAUDE.md section 4); Read rules also cover Grep and Glob.
          settings: |
            {
              "permissions": {
                "deny": [
                  "Read(./esp32_firmware/include/WebAssets.h)",
                  "Edit(./esp32_firmware/include/WebAssets.h)",
                  "Read(./setup/piso-setup.sh)",
                  "Edit(./setup/piso-setup.sh)",
                  "Read(./website/setup/**)",
                  "Edit(./website/setup/**)",
                  "Read(./website/pisophone_setup.py)",
                  "Edit(./website/pisophone_setup.py)",
                  "Edit(./website/install.sh)",
                  "Read(./website/update/**)",
                  "Edit(./website/update/**)",
                  "Read(./website/flash/**)",
                  "Edit(./website/flash/**)",
                  "Read(./tools/pisoportal/bin/**)",
                  "Edit(./tools/pisoportal/bin/**)",
                  "Read(./website/js/*-bundle.js)",
                  "Edit(./website/js/*-bundle.js)",
                  "Edit(./app/schemas/**)"
                ]
              }
            }
          claude_args: |
            --model ${{ steps.model.outputs.name }}
            --max-turns 60
            --allowedTools "Bash,Read,Edit,MultiEdit,Write,Glob,Grep"
            --append-system-prompt "You are the Implementer described in CLAUDE.md. Read CLAUDE.md first. Make only the changes the issue asks for, on the branch the action created from beta. Run every command in the issue's Verification section and fix what fails before pushing; report each command and its result in your comment. Never push to main or beta directly, never change signing keys, secrets or files under website/update, and never open or edit the generated files listed in CLAUDE.md section 4 (do not cat or grep them either; change their source and regenerate). If the Verification commands still fail after a few focused attempts, stop and report what fails instead of retrying. If the issue says it is blocked or waits for another issue that is still open, stop and say so instead of implementing it."
