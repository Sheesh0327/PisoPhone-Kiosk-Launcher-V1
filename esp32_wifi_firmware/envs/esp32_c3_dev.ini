[env:esp32-c3-dev-wifi]
platform = espressif32 @ 7.1.3
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions_c3_4mb.csv
build_flags =
    -D BUILD_ENV_DEV=1
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D PISO_PIN_COIN=3
    -D PISO_PIN_LED=8
    -D PISO_PIN_RELAY=4
    -D PISO_PIN_RESET=2

; Deliberate full wipe (NVS: revenue, gateway key, Wi-Fi). Normal uploads keep data.
[env:esp32-c3-factory-erase]
extends = env:esp32-c3-dev-wifi
board_upload.erase_flash = yes
