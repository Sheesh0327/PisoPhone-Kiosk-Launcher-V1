[env:esp32dev-dev-wifi]
platform = espressif32 @ 7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions_4mb.csv
build_flags =
    -D BUILD_ENV_DEV=1
    -D CORE_DEBUG_LEVEL=0
    -D PISO_PIN_COIN=3
    -D PISO_PIN_LED=2
    -D PISO_PIN_RELAY=4
    -D PISO_PIN_RESET=15
