; PlatformIO Project Configuration File for PisoWiFi ESP32-C3 / ESP32 Coin Box Firmware
; Framework: Arduino

; Exact versions: a build must be reproducible (CI caches by this file).
[env]
lib_deps =
    bblanchon/ArduinoJson @ 6.21.6

[platformio]
src_dir = src
include_dir = include
default_envs = esp32-c3-dev-wifi
extra_configs = envs/*.ini
