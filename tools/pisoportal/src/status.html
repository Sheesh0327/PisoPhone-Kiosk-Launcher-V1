<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TechNet PisoWifi</title>
<link rel="icon" href="/brand.png">
<link rel="apple-touch-icon" href="/brand.png">
<style>
%CSS%
.big{font-size:44px;margin:4px 0 0}
#slow{background:var(--line);color:var(--fg)}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
</style>
</head><body><div class="w">
<header><img class="logo" src="/brand.png" alt="" width="40" height="40"><span><b>TechNet</b> <span>PisoWifi</span></span></header>
<div id="v-conn" class="v"><p class="mut c" id="conn">Connecting&hellip;</p></div>
<div id="v-on" class="v card">
<p class="mut c">Connected &middot; time left</p>
<div class="big" id="t">--:--:--</div>
<div class="bar"><i id="bar" style="width:0"></i></div>
<div class="row"><span class="pill" id="plan"></span><span class="mut" id="used" style="display:none"></span></div>
<div class="msg" id="slow" style="display:none">Speed is reduced for a few minutes (fair use).</div>
<a class="btn" href="/">Add more time</a>
</div>
<div id="v-off" class="v card">
<p class="mut c" id="offsub"></p>
<div class="big">0:00:00</div>
<div class="msg" id="offmsg"></div>
<a class="btn" href="/">Insert Coin</a>
</div>
<div id="v-pay" class="v card">
<p class="mut c">Payment in progress</p>
<div class="msg ok">A coin window is open on this device. Go back to the coin page to finish it.</div>
<a class="btn" href="/">Back to the coin page</a>
</div>
</div>
<script>
(function(){
var ws=null,tk=null,left=0,total=0,fails=0;
function el(i){return document.getElementById(i)}
function put(i,t){var e=el(i);if(e&&e.textContent!==t)e.textContent=t}
function show(n){var l=document.getElementsByClassName("v"),i;for(i=0;i<l.length;i++)l[i].style.display=l[i].id==="v-"+n?"block":"none"}
function pn(p){return p==="endurance"?"Endurance":p==="hyper"?"HyperSpeed":""}
function p2(n){return(n<10?"0":"")+n}
function clock(s){s=Math.max(0,s|0);return Math.floor(s/3600)+":"+p2(Math.floor(s%3600/60))+":"+p2(s%60)}
function paint(){
 if(left<=0){stopTick();off("Time is up","Insert a coin to get back online.");return}
 put("t",clock(left));el("bar").style.width=Math.min(100,100*left/Math.max(total,left))+"%"}
function stopTick(){if(tk){clearInterval(tk);tk=null}}
function off(sub,msg){put("offsub",sub);put("offmsg",msg);show("off")}
function view(j){
 var s=j.s;stopTick();
 if(s==="starting"||s==="armed"||s==="closing"){show("pay");return}
 if((s==="idle"||s==="final")&&j.left>0&&j.online){
  left=j.left;if(left>total)total=left;put("plan",pn(j.plan));
  var u=el("used");if(j.plan==="hyper"){u.style.display="inline";put("used",j.used_mb+" MB used")}else u.style.display="none";
  el("slow").style.display=j.slow>0?"block":"none";el("plan").style.display=pn(j.plan)?"inline-block":"none";
  show("on");paint();tk=setInterval(function(){left--;paint()},1000);return}
 if(s==="idle"||s==="final"){
  if(j.left>0)off("Not connected yet","You have "+clock(j.left)+" saved. Open the coin page to get online.");
  else off("Not connected","No Wi-Fi time. Insert a coin to get online.");
  return}
 off("Not connected","Open the coin page to continue.")}
function connect(){
 var p=location.protocol==="https:"?"wss://":"ws://";
 try{ws=new WebSocket(p+location.host+"/ws")}catch(e){put("conn","This phone's browser cannot show live status.");show("conn");return}
 ws.onopen=function(){fails=0;ws.send(JSON.stringify({t:"hello"}))};
 ws.onmessage=function(m){var j;try{j=JSON.parse(m.data)}catch(e){return}if(j.t==="state")view(j)};
 // the countdown keeps running while the link is down; the page says nothing until it is up again for long
 ws.onclose=function(){ws=null;if(++fails>2&&!tk){put("conn","Reconnecting…");show("conn")}setTimeout(connect,1500)};
 ws.onerror=function(){try{ws.close()}catch(e){}}}
show("conn");connect();
})();
</script></body></html>
