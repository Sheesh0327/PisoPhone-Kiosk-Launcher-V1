[package]
name = "coinslot-probe"
version = "0.1.0"
edition = "2021"
publish = false
description = "Throw-away probe: does a small static Rust program run on this router, and how fast is it?"

[dependencies]
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
