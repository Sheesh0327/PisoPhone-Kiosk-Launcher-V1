; DRAFT, NEVER BUILT. Route 1 of docs/PROVISIONING_SOLD_UNIT.md section 1 (pioarduino + custom_sdkconfig).
; It sits here, not in esp32_firmware/envs/, on purpose: PlatformIO loads envs/*.ini, and an environment nobody has built
; must not be picked up by CI or the firmware bundles. It could not be built in the cloud session that wrote it (validation.md,
; criteria 1 and 2). Build it on your PC, read the sdkconfig it produces, and only then move it into esp32_firmware/envs/.
;
; The secure-boot signing key is NEW, RSA-3072, and SEPARATE from the firmware-signing key. CONFIG_SECURE_BOOT_SIGNING_KEY is
; deliberately absent: you sign offline with espsecure.py. No key belongs in this file or anywhere in the repository.
;
; Two things to know before trusting it:
; 1. The pioarduino platform is a different Arduino core and ESP-IDF than the espressif32 @ 7.1.3 the real boxes run. Building the
;    APP with it would change every box; the plan only needs the BOOTLOADER from it (guide section 1, route 2 allows the stock app).
; 1b. Changed 2026-10-28 for D28: CONFIG_SECURE_UART_ROM_DL_MODE is a menu title, not a setting; the setting is CONFIG_SECURE_ENABLE_SECURE_ROM_DL_MODE.
;    Signing is offline, so build-time signing is off. Never add CONFIG_SECURE_DISABLE_ROM_DL_MODE (it burns DIS_DOWNLOAD_MODE).
; 2. The two ROLLBACK lines are the ones that fail silently if lost. After the build, grep the sdkconfig it wrote (bench.md, part B).

[env:esp32-c3-secure-boot-draft]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = partitions_encrypted.csv
board_build.flash_mode = dio
custom_sdkconfig =
    CONFIG_SECURE_BOOT=y
    CONFIG_SECURE_BOOT_V2_ENABLED=y
    CONFIG_SECURE_BOOT_V2_RSA_ENABLED=y
    CONFIG_SECURE_FLASH_ENC_ENABLED=y
    CONFIG_SECURE_FLASH_ENCRYPTION_MODE_RELEASE=y
    CONFIG_SECURE_ENABLE_SECURE_ROM_DL_MODE=y
    CONFIG_SECURE_BOOT_BUILD_SIGNED_BINARIES=n
    CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y
    CONFIG_APP_ROLLBACK_ENABLE=y
build_flags =
    -D BUILD_ENV_PRODUCTION=1
    -D ARDUINO_USB_MODE=1
    -D PISO_PIN_COIN=3
    -D PISO_PIN_LED=8
    -D PISO_PIN_RELAY=4
    -D PISO_PIN_RESET=2
    -D ARDUINO_USB_CDC_ON_BOOT=1
